name: Engine Play Store (Production)
on:
    workflow_call:
        inputs:
            flavor: { type: string, required: true, default: "prod" }
            track: { type: string, default: "internal" }
        secrets:
            SHOREBIRD_TOKEN: { required: true }
            PLAY_STORE_CONFIG_JSON: { required: true }
jobs:
    release_to_store:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shorebirdtech/setup-shorebird@v1
            - uses: subosito/flutter-action@v2
              with: { channel: stable, cache: true }
            - env:
                  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
              run: |
                  shorebird release android --flavor=${{ inputs.flavor }} --no-tree-shake-icons
            - id: find_aab
              run: |
                  AAB_PATH=$(find build/app/outputs/bundle/${{ inputs.flavor }}Release -name "*.aab" | head -1)
                  echo "path=$AAB_PATH" >> $GITHUB_OUTPUT
            - name: Extract Application ID
              id: get_app_id
              shell: bash
              run: |
                  APP_ID=$(grep -E 'applicationId\s*=\s*"' android/app/build.gradle.kts | sed -E 's/.*applicationId\s*=\s*"([^"]+)".*/\1/' | head -1)
                  if [ -z "$APP_ID" ]; then
                    echo "❌ Could not find applicationId in build.gradle.kts"
                    exit 1
                  fi
                  echo "Found Package Name: $APP_ID"
                  echo "package_name=$APP_ID" >> $GITHUB_OUTPUT
            - uses: r0adkll/upload-google-play@v1
              with:
                  serviceAccountJsonKeyContent: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
                  packageName: ${{ steps.get_app_id.outputs.package_name }}
                  releaseFiles: ${{ steps.find_aab.outputs.path }}
                  track: ${{ inputs.track }}
                  status: completed
