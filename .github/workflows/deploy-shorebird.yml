name: Deploy Shorebird

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
    outputs:
      full_version:
        value: ${{ jobs.version.outputs.full_version }}
      version_changed:
        value: ${{ jobs.combine.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false
jobs:
  check_platforms:
    runs-on: ubuntu-latest
    outputs:
      android_exists: ${{ steps.check.outputs.android_exists }}
      windows_exists: ${{ steps.check.outputs.windows_exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d "android" ]; then echo "android_exists=true" >> $GITHUB_OUTPUT; else echo "android_exists=false" >> $GITHUB_OUTPUT; fi
          if [ -d "windows" ]; then echo "windows_exists=true" >> $GITHUB_OUTPUT; else echo "windows_exists=false" >> $GITHUB_OUTPUT; fi

  version:
    needs: check_platforms
    uses: ./.github/workflows/get-version.yml

  android:
    needs: [check_platforms, version]
    if: needs.check_platforms.outputs.android_exists == 'true'
    uses: ./.github/workflows/deploy-android-shorebird.yml
    with:
      flavor: ${{ inputs.flavor }}
      full_version: ${{ needs.version.outputs.full_version }}
      base_version: ${{ needs.version.outputs.base_version }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

  windows:
    needs: [check_platforms, version]
    if: needs.check_platforms.outputs.windows_exists == 'true'
    uses: ./.github/workflows/deploy-windows-shorebird.yml
    with:
      flavor: ${{ inputs.flavor }}
      full_version: ${{ needs.version.outputs.full_version }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  combine:
    needs: [version, android, windows]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ needs.version.outputs.full_version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        run: |
          a="${{ needs.android.outputs.changed }}"
          w="${{ needs.windows.outputs.changed }}"
          if [ "$a" = "true" ] || [ "$w" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
