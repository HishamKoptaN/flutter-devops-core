name: Deploy Layer (Shorebird)

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      platforms:
        type: string
        required: false
        default: ""
        description: "Comma-separated platforms (e.g., android,windows,ios,macos,linux)"
      version_changed:
        type: boolean
        required: false
        default: true
    outputs:
      android_built:
        value: ${{ jobs.check.outputs.android_built }}
      ios_built:
        value: ${{ jobs.check.outputs.ios_built }}
      macos_built:
        value: ${{ jobs.check.outputs.macos_built }}
      linux_built:
        value: ${{ jobs.check.outputs.linux_built }}
      windows_built:
        value: ${{ jobs.check.outputs.windows_built }}
      full_version:
        value: ${{ jobs.version.outputs.full_version }}
      base_version:
        value: ${{ jobs.version.outputs.base_version }}
      android_patch:
        value: ${{ jobs.check.outputs.android_patch }}
      ios_patch:
        value: ${{ jobs.check.outputs.ios_patch }}
      macos_patch:
        value: ${{ jobs.check.outputs.macos_patch }}
      linux_patch:
        value: ${{ jobs.check.outputs.linux_patch }}
      windows_patch:
        value: ${{ jobs.check.outputs.windows_patch }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  version:
    if: inputs.version_changed == 'true'
    uses: ./.github/workflows/00-core-get-version.yml

  check:
    needs: version
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    uses: ./.github/workflows/30-deploy-check.yml
    with:
      platforms: ${{ inputs.platforms }}
      version_changed: ${{ inputs.version_changed }}

  android:
    needs: [version, check]
    if: |
      always() && 
      needs.check.result == 'success' && 
      needs.check.outputs.android_built == 'true'
    uses: ./.github/workflows/30-deploy-android.yml
    with:
      flavor: ${{ inputs.flavor }}
      full_version: ${{ needs.version.outputs.full_version }}
      base_version: ${{ needs.version.outputs.base_version }}
      use_patch: ${{ needs.check.outputs.android_patch }}
    secrets: inherit

  ios:
    needs: [version, check]
    if: |
      always() && 
      needs.check.result == 'success' && 
      needs.check.outputs.ios_built == 'true'
    uses: ./.github/workflows/30-deploy-ios.yml
    with:
      flavor: ${{ inputs.flavor }}
      full_version: ${{ needs.version.outputs.full_version }}
      base_version: ${{ needs.version.outputs.base_version }}
      use_patch: ${{ needs.check.outputs.ios_patch }}
    secrets: inherit

  macos:
    needs: [version, check]
    if: |
      always() && 
      needs.check.result == 'success' && 
      needs.check.outputs.macos_built == 'true'
    uses: ./.github/workflows/30-deploy-macos.yml
    with:
      flavor: ${{ inputs.flavor }}
      full_version: ${{ needs.version.outputs.full_version }}
      base_version: ${{ needs.version.outputs.base_version }}
      use_patch: ${{ needs.check.outputs.macos_patch }}
    secrets: inherit

  linux:
    needs: [version, check]
    if: |
      always() && 
      needs.check.result == 'success' && 
      needs.check.outputs.linux_built == 'true'
    uses: ./.github/workflows/30-deploy-linux.yml
    with:
      flavor: ${{ inputs.flavor }}
      full_version: ${{ needs.version.outputs.full_version }}
      base_version: ${{ needs.version.outputs.base_version }}
      use_patch: ${{ needs.check.outputs.linux_patch }}
    secrets: inherit

  windows:
    needs: [version, check]
    if: |
      always() && 
      needs.check.result == 'success' && 
      needs.check.outputs.windows_built == 'true'
    uses: ./.github/workflows/30-deploy-windows.yml
    with:
      flavor: ${{ inputs.flavor }}
      full_version: ${{ needs.version.outputs.full_version }}
      base_version: ${{ needs.version.outputs.base_version }}
      use_patch: ${{ needs.check.outputs.windows_patch }}
    secrets: inherit
