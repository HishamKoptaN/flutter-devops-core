name: Shorebird Android Patch
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
    outputs:
      changed:
        value: ${{ jobs.patch.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  patch:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - id: run
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          flavor="${{ inputs.flavor }}"
          TARGET_ID="e962126d-ee7a-48f2-b89d-fb0349f4a05f"
          if [ "$flavor" = "prod" ]; then
            TARGET_ID="ed427ccb-5edb-4594-a376-2ee9636bef4e"
          fi
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml

          echo "Attempting shorebird patch targeting latest release..."
          if shorebird patch android --flavor=$flavor --release-version=latest --dart-define=ENV=$flavor '--' --no-tree-shake-icons; then
            echo "Patch created successfully!"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Patch failed! Switching to release pipeline..."
            exit 1
          fi