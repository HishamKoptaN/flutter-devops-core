name: 20-shorebird-deploy-google-play.yml
on:
  workflow_call:
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref_name }}
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/android/setup-android-shorebird@prod
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/cache-flutter-android@prod
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/android/shorebird-android-aab-release@prod