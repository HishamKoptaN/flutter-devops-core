name: Shorebird Android Core
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      use_patch:
        type: boolean
        required: false
        default: true
    outputs:
      changed:
        value: ${{ jobs.shorebird.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false
jobs:
  shorebird:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - id: run
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
         flavor="${{ inputs.flavor }}"
         usePatch="${{ inputs.use_patch }}"
         TARGET_ID="e962126d-ee7a-48f2-b89d-fb0349f4a05f"
         if [ "$flavor" = "prod" ]; then
           TARGET_ID="ed427ccb-5edb-4594-a376-2ee9636bef4e"
         fi
         sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
         versionChanged=false

         get_next_release_version() {
           releases_json=$(shorebird releases list --platform=android --format=json 2>/dev/null || echo "[]")
           latest_version=$(echo "$releases_json" | jq -r '.[0].version // empty')
           
           if [ -z "$latest_version" ]; then
             echo "1.0.0+1"
           else
             base_ver=$(echo "$latest_version" | cut -d'+' -f1)
             build_num=$(echo "$latest_version" | cut -d'+' -f2)
             
             if [ "$base_ver" = "$build_num" ]; then
               echo "${base_ver}+2"
             else
               echo "${base_ver}+$((build_num + 1))"
             fi
           fi
         }

         create_release() {
           NEXT_VERSION=$(get_next_release_version)
           echo "Creating new release version on Shorebird: $NEXT_VERSION"
           if shorebird release android --flavor=$flavor --dart-define=ENV=$flavor --artifact=apk '--' --no-tree-shake-icons 2>&1 | tee /tmp/release_output; then
             versionChanged=true
           else
             if grep -qi "existing.*release\|already exists" /tmp/release_output; then
               versionChanged=false
             else
               cat /tmp/release_output
               exit 1
             fi
           fi
         }
         if [ "$usePatch" = "true" ]; then
           if shorebird patch android --flavor=$flavor --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | tee /tmp/patch_output; then
             versionChanged=false
           else
             if grep -qi "Release not found\|No release exists\|UnpatchableChangeException\|asset changes\|native changes" /tmp/patch_output; then
               create_release
             else
               cat /tmp/patch_output
               exit 1
             fi
           fi
         else
           create_release
         fi
         echo "changed=$versionChanged" >> $GITHUB_OUTPUT
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.flavor }}
          path: build/app/outputs/**/*.apk
          retention-days: 1
