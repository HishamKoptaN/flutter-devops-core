name: 30-shorebird-android-prod-release
on:
  workflow_call:
    inputs:
      shorebird_app_id:
        type: string
        required: true  
      track:
        required: false
        type: string
        default: "internal"
    outputs:
      changed:
        value: ${{ jobs.release.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
     TRACK: ${{ inputs.track }} 
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/setup-android-shorebird@prod
  
      - run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/muein_orders.jks
      - run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=muein_orders.jks
          EOF
      - id: run
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          flavor="${{ github.ref_name }}"
          TARGET_ID="${{ inputs.shorebird_app_id }}"
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          latest_version=$(shorebird releases list --platform=android 2>/dev/null | grep 'android' | head -n 1 | awk '{print $2}')
          if [ -z "$latest_version" ]; then
            BUILD_NAME="1.0.0"
            BUILD_NUMBER="1"
          else
            raw_base=$(echo "$latest_version" | cut -d'+' -f1)
            BUILD_NAME=$(echo "$raw_base" | cut -d'-' -f1)
            raw_build=$(echo "$latest_version" | grep -q '+' && echo "$latest_version" | cut -d'+' -f2 || echo "0")
            BUILD_NUMBER=$((raw_build + 1))
          fi
          if steps.run.outputs.env == 'dev' \
          --flavor=$flavor \
          --build-name=$BUILD_NAME \
          --build-number=$BUILD_NUMBER \
          --dart-define=ENV=$flavor \
          --artifact=apk \
          '--' --no-tree-shake-icons; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            shorebird release android \
            --flavor=prod \
            --dart-define=ENV=prod \
            --confirm
            echo "release_built=true" >> $GITHUB_OUTPUT
            exit 1
          fi
      - id: upload-play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.muein.orders
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ env.TRACK }}
          status: ${{ env.TRACK == 'production' && 'completed' || 'draft' }}