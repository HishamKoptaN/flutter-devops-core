name: Parallel Build Engine

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      platforms:
        type: string
        required: false
        default: ""
      version:
        type: string
        required: true
      build_android:
        type: boolean
        required: false
        default: true
      build_ios:
        type: boolean
        required: false
        default: true
      build_windows:
        type: boolean
        required: false
        default: true
      build_macos:
        type: boolean
        required: false
        default: true
      build_linux:
        type: boolean
        required: false
        default: true

jobs:
  android:
    if: |
      contains(inputs.platforms, 'android') && 
      inputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Android Build
        run: |
          echo "🤖 Building Android in parallel..."
          echo "Flavor: ${{ inputs.flavor }}"
          echo "Version: ${{ inputs.version }}"
          # Build logic here

  ios:
    if: |
      contains(inputs.platforms, 'ios') && 
      inputs.build_ios == 'true'
    runs-on: macos-latest
    steps:
      - name: 🍎 Building iOS in parallel...
        run: |
          echo "🍎 Building iOS in parallel..."
          echo "Flavor: ${{ inputs.flavor }}"
          echo "Version: ${{ inputs.version }}"
          # Build logic here

  windows:
    if: |
      contains(inputs.platforms, 'windows') && 
      inputs.build_windows == 'true'
    runs-on: windows-latest
    steps:
      - name: 🖥️ Building Windows in parallel...
        run: |
          echo "🖥️ Building Windows in parallel..."
          echo "Flavor: ${{ inputs.flavor }}"
          echo "Version: ${{ inputs.version }}"
          # Build logic here

  macos:
    if: |
      contains(inputs.platforms, 'macos') && 
      inputs.build_macos == 'true'
    runs-on: macos-latest
    steps:
      - name: 🍎 Building macOS in parallel...
        run: |
          echo "🍎 Building macOS in parallel..."
          echo "Flavor: ${{ inputs.flavor }}"
          echo "Version: ${{ inputs.version }}"
          # Build logic here

  linux:
    if: |
      contains(inputs.platforms, 'linux') && 
      inputs.build_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🐧 Building Linux in parallel...
        run: |
          echo "🐧 Building Linux in parallel..."
          echo "Flavor: ${{ inputs.flavor }}"
          echo "Version: ${{ inputs.version }}"
          # Build logic here
