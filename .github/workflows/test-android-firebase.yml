name: Test Android Build + Firebase
on:
  push:
    branches: [devs]
jobs:
  check_android:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: check
        run: |
          if [ -d "android" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Android directory found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Android directory not found, skipping Android build"
          fi
  version:
    needs: check_android
    if: needs.check_android.outputs.exists == 'true'
    uses: ./.github/workflows/get-version.yml
  build_shorebird:
    needs: [check_android, version]
    if: needs.check_android.outputs.exists == 'true'
    uses: ./.github/workflows/deploy-android-shorebird.yml
    with:
      flavor: dev
      full_version: ${{ needs.version.outputs.full_version }}
      base_version: ${{ needs.version.outputs.base_version }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  build_firebase_apk:
    needs: [check_android, build_shorebird]
    if: always() && needs.check_android.outputs.exists == 'true' && (needs.build_shorebird.outputs.changed == 'true' || needs.build_shorebird.result == 'success')
    uses: ./.github/workflows/build-firebase-apk.yml
    with:
      flavor: dev
    secrets:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_ADMIN_SDK: ${{ secrets.FIREBASE_ADMIN_SDK }}
