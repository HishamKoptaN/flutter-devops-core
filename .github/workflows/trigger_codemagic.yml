name: Trigger Codemagic Build

on:
  push:
    branches:
      - prod
  workflow_dispatch:
jobs:
  trigger-codemagic:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Codemagic Workflow
        run: |
          curl -X POST "https://api.codemagic.io/builds" \
            -H "Content-Type: application/json" \
            -H "x-auth-token: ${{ secrets.CODEMAGIC_API_TOKEN }}" \
            -d '{
              "appId": "ضع_هنا_معرف_تطبيقك_في_كودماجيك",
              "workflowId": "ضع_هنا_اسم_الـ Workflow_في_كودماجيك",
              "branch": "prod"
            }'