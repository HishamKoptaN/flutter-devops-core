name: Deploy Android (Shorebird Release Only)

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      version:
        type: string
        required: true
    outputs:
      release_completed:
        value: ${{ jobs.shorebird.outputs.release_completed }}
      patch_completed:
        value: ${{ jobs.shorebird.outputs.patch_completed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  shorebird:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    outputs:
      release_completed: ${{ steps.deploy.outputs.release_completed }}
      patch_completed: ${{ steps.deploy.outputs.patch_completed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - id: deploy
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "🚀 Starting Shorebird deployment for flavor: ${{ inputs.flavor }}"
          
          # Set app ID based on flavor
          TARGET_ID=$(if [ "${{ inputs.flavor }}" = "prod" ]; then echo "ed427ccb-5edb-4594-a376-2ee9636bef4e"; else echo "e962126d-ee7a-48f2-b89d-fb0349f4a05f"; fi)
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          echo "✅ App ID set to: $TARGET_ID"

          release_completed="false"
          patch_completed="false"

          # Try patch first
          echo "🔧 Attempting patch..."
          if shorebird patch android --dart-define=ENV=${{ inputs.flavor }} --no-tree-shake-icons 2>&1 | tee patch.log; then
            echo "✅ Patch succeeded"
            patch_completed="true"
          else
            echo "⚠️ Patch failed, attempting release..."
            
            # Try release
            if shorebird release android --dart-define=ENV=${{ inputs.flavor }} --no-tree-shake-icons 2>&1 | tee release.log; then
              echo "✅ Release succeeded"
              release_completed="true"
            else
              echo "❌ Both patch and release failed"
              exit 1
            fi
          fi

          echo "release_completed=$release_completed" >> $GITHUB_OUTPUT
          echo "patch_completed=$patch_completed" >> $GITHUB_OUTPUT
