name: Main

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      build_android:
        type: boolean
        default: false
        description: 'Enable Android build'
      build_windows:
        type: boolean
        default: false
        description: 'Enable Windows build'
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      flavor:
        type: string
        default: 'dev'
      build_android:
        type: boolean
        default: false
        description: 'Enable Android build'
      build_windows:
        type: boolean
        default: false
        description: 'Enable Windows build'

jobs:
  setup:
    uses: ./.github/workflows/00-setup.yml
    with:
      flavor: ${{ inputs.flavor || github.ref_name }}
      build_android: ${{ inputs.build_android || false }}
      build_windows: ${{ inputs.build_windows || false }}

  shorebird:
    needs: setup
    if: needs.setup.outputs.version_changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/20-shorebird.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      build_android: ${{ inputs.build_android || false }}
      build_windows: ${{ inputs.build_windows || false }}
    secrets: inherit

  build_android:
    needs: [setup, shorebird]
    if: |
      always() && 
      (needs.shorebird.result == 'success' || needs.shorebird.result == 'skipped') &&
      needs.setup.outputs.android_enabled == 'true'
    uses: ./.github/workflows/10-build-android-artifacts.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
    secrets: inherit

  build_windows:
    needs: [setup, shorebird]
    if: |
      always() && 
      (needs.shorebird.result == 'success' || needs.shorebird.result == 'skipped') &&
      needs.setup.outputs.windows_enabled == 'true'
    uses: ./.github/workflows/10-build-windows-exe.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
    secrets: inherit

  build_installer:
    needs: [setup, build_windows]
    if: |
      always() && 
      (needs.build_windows.result == 'success') &&
      needs.setup.outputs.windows_enabled == 'true'
    uses: ./.github/workflows/30-deploy-installer.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      full_version: ${{ needs.shorebird.outputs.full_version }}
      exe_name: ${{ needs.build_windows.outputs.exe_name }}
      app_name: "Abujena"
      app_publisher: "Abujena Dawajen"
    secrets: inherit

  distribute:
    needs: [setup, shorebird, build_android, build_windows, build_installer]
    if: always() && needs.shorebird.outputs.version_changed == 'true'
    uses: ./.github/workflows/40-distribute-android.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
    secrets: inherit

  cleanup:
    needs: distribute
    if: always()
    uses: ./.github/workflows/00-core-cleanup-releases.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
    secrets:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}