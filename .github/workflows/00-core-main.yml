name: Main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      platforms:
        type: string
        required: false
        default: ""
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      flavor:
        type: string
        default: 'dev'
      platforms:
        type: string
        default: ''
jobs: 
  setup:
    uses: ./.github/workflows/00-setup.yml
    with:
      flavor: ${{ inputs.flavor || github.ref_name }}
      platforms: ${{ inputs.platforms || 'android,windows' }}

  deploy_layer:
    needs: setup
    if: needs.setup.outputs.version_changed == 'true' || needs.setup.outputs.version_changed == true
    uses: ./.github/workflows/30-deploy-layer.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      platforms: ${{ inputs.platforms || 'android,windows' }}
      version_changed: ${{ needs.setup.outputs.version_changed }}
    secrets: inherit

  build_layer:
    needs: [setup, deploy_layer]
    if: |
      always() && 
      (needs.deploy_layer.result == 'success' || needs.deploy_layer.result == 'skipped')
    uses: ./.github/workflows/31-build-layer.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      platforms: ${{ inputs.platforms || 'android,windows' }}
      android_built: ${{ needs.deploy_layer.outputs.android_built || 'false' }}
      windows_built: ${{ needs.deploy_layer.outputs.windows_built || 'false' }}
      full_version: ${{ needs.deploy_layer.outputs.full_version }}
      base_version: ${{ needs.deploy_layer.outputs.base_version }}
    secrets: inherit

  distribution_layer:
    needs: [setup, deploy_layer, build_layer]
    if: always()
    uses: ./.github/workflows/32-distribution-layer.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      platforms: ${{ inputs.platforms || 'android,windows' }}
      version_changed: ${{ needs.setup.outputs.version_changed }}
      windows_exe_name: ${{ needs.build_layer.outputs.windows_exe_name }}
      full_version: ${{ needs.deploy_layer.outputs.full_version }}
    secrets: inherit