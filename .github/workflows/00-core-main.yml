name: main
env:
  force_javascript_actions_to_node24: true
  actions_allow_use_unsecure_node_version: true
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      platforms:
        type: string
        required: false
        default: "android"
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      flavor:
        type: string
        default: 'dev'
      platforms:
        type: string
        default: 'android'
jobs: 
  setup:
    uses: ./.github/workflows/00-setup.yml
    with:
      flavor: ${{ inputs.flavor || github.ref_name }}
      platforms: ${{ inputs.platforms || 'android' }}
  deploy_layer:
    needs: setup
    if: needs.setup.outputs.version_changed == 'true'
    uses: ./.github/workflows/30-deploy-layer.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      platforms: ${{ inputs.platforms || 'android' }}
      version_changed: ${{ needs.setup.outputs.version_changed == 'true' }}
    secrets: inherit

  build_layer:
    needs: [setup, deploy_layer]
    if: |
      always() && 
      (needs.deploy_layer.result == 'success' || needs.deploy_layer.result == 'skipped')
    uses: ./.github/workflows/31-build-layer.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      platforms: ${{ inputs.platforms || 'android' }}
    secrets: inherit
  distribution_layer:
    needs: [setup, deploy_layer, build_layer]
    if: always()
    uses: ./.github/workflows/32-distribution-layer.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      platforms: ${{ inputs.platforms || 'android' }}
      version_changed: ${{ needs.setup.outputs.version_changed == 'true' }}
      full_version: ${{ needs.deploy_layer.outputs.full_version }}
    secrets: inherit