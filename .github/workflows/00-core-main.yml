name: main
env:
  force_javascript_actions_to_node24: true
  actions_allow_use_unsecure_node_version: true
permissions:
  contents: write
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      platforms:
        type: string
        required: false
        default: "android"
      app_name:
        type: string
        required: false
        default: "devops"
      app_publisher:
        type: string
        required: false
        default: "devops"
      environment:
        type: string
        required: false
        description: 'Target environment (dev/prod)'
      firebase_app_id:
        type: string
        required: false
        description: 'Firebase App ID override'
      windows_exe_name:
        type: string
        required: false
        description: 'Windows executable name'
    secrets:
      FIREBASE_ADMIN_SDK:
        required: false
      SHOREBIRD_TOKEN:
        required: false
      FIREBASE_TOKEN:
        required: false
      GITHUB_TOKEN:
        required: false
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      flavor:
        type: string
        default: 'dev'
      platforms:
        type: string
        default: 'android'
      test_type:
        type: string
        default: 'both'
jobs: 
  setup:
    uses: ./.github/workflows/00-setup.yml
    with:
      flavor: ${{ inputs.flavor || github.ref_name }}
      platforms: ${{ inputs.platforms }}
  test_firebase:
    needs: setup
    uses: ./.github/workflows/99-test-firebase.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      test_type: ${{ inputs.test_type || 'both' }}
    secrets:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_ADMIN_SDK: ${{ secrets.FIREBASE_ADMIN_SDK }}
