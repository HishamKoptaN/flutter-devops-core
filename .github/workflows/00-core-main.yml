name: main
env:
  force_javascript_actions_to_node24: true
  actions_allow_use_unsecure_node_version: true
permissions:
  contents: write
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      platforms:
        type: string
        required: false
        default: "android"
      app_name:
        type: string
        required: false
        default: "devops"
      app_publisher:
        type: string
        required: false
        default: "devops"
    secrets:
      FIREBASE_ADMIN_SDK:
        required: false
      SHOREBIRD_TOKEN:
        required: false
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      flavor:
        type: string
        default: 'dev'
      platforms:
        type: string
        default: 'android'
jobs: 
  setup:
    uses: ./.github/workflows/00-setup.yml
    with:
      flavor: ${{ inputs.flavor || github.ref_name }}
      platforms: ${{ inputs.platforms }}
  shorebird_layer:
    needs: setup
    uses: ./.github/workflows/20-shorebird-layer.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      platforms: ${{ inputs.platforms }}
    secrets: inherit
  build_layer:
    needs: setup
    uses: ./.github/workflows/40-build-layer.yml
    with: 
      flavor: ${{ needs.setup.outputs.flavor }}
      platforms: ${{ inputs.platforms }}
    secrets: inherit
  distribution_layer:
    needs: [setup, shorebird_layer]
    if: always()
    uses: ./.github/workflows/50-distribution-layer.yml
    with:
      flavor: ${{ needs.setup.outputs.flavor }}
      platforms: ${{ inputs.platforms }}
      full_version: ${{ needs.shorebird_layer.outputs.full_version }}
      app_name: ${{ inputs.app_name }}
      app_publisher: ${{ inputs.app_publisher }}
    secrets: inherit