name: Ultra Smart Cache System (AI-like)

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        required: false
        default: ""
      strategy:
        type: string
        required: false
        default: "intelligent"
        description: "conservative, standard, intelligent, ultra"
    outputs:
      decision:
        value: ${{ jobs.analyze.outputs.decision }}
      cache_keys:
        value: ${{ jobs.analyze.outputs.cache_keys }}
      build_needed:
        value: ${{ jobs.analyze.outputs.build_needed }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      cache_keys: ${{ steps.keys.outputs.cache_keys }}
      build_needed: ${{ steps.decide.outputs.build_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      # 🔥 Ultra Change Detection
      - name: 🔍 Ultra Change Detection
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          
          # Deep analysis
          dart_changed="false"
          android_changed="false"
          ios_changed="false"
          native_changed="false"
          config_changed="false"
          
          # Analyze each change type
          if echo "$CHANGED_FILES" | grep -q -E "^lib/.*\.dart$"; then
            dart_changed="true"
          fi
          
          if echo "$CHANGED_FILES" | grep -q -E "^android/.*\.(kt|java|gradle|xml)$"; then
            android_changed="true"
            native_changed="true"
          fi
          
          if echo "$CHANGED_FILES" | grep -q -E "^ios/.*\.(swift|m|h|plist)$"; then
            ios_changed="true"
            native_changed="true"
          fi
          
          if echo "$CHANGED_FILES" | grep -q -E "^(pubspec\.yaml|\.env|shorebird\.yaml)$"; then
            config_changed="true"
          fi
          
          echo "🔍 Ultra Analysis:"
          echo "Dart Changed: $dart_changed"
          echo "Android Changed: $android_changed"
          echo "iOS Changed: $ios_changed"
          echo "Native Changed: $native_changed"
          echo "Config Changed: $config_changed"
          
          echo "dart_changed=$dart_changed" >> $GITHUB_OUTPUT
          echo "android_changed=$android_changed" >> $GITHUB_OUTPUT
          echo "ios_changed=$ios_changed" >> $GITHUB_OUTPUT
          echo "native_changed=$native_changed" >> $GITHUB_OUTPUT
          echo "config_changed=$config_changed" >> $GITHUB_OUTPUT
      
      # 🔥 Smart Cache Keys Generation
      - name: 🔑 Generate Smart Cache Keys
        id: keys
        run: |
          # Generate content-based keys
          pub_key="pub-${{ runner.os }}-$(sha256sum pubspec.lock 2>/dev/null | cut -d' ' -f1 || echo 'no-lock')"
          
          # Platform-specific keys
          gradle_key="gradle-${{ runner.os }}-$(find android -name '*.gradle*' -type f -exec sha256sum {} + 2>/dev/null | sha256sum | cut -d' ' -f1 || echo 'no-gradle')"
          
          dart_key="dart-${{ runner.os }}-$(find lib -name '*.dart' -type f -exec sha256sum {} + 2>/dev/null | sha256sum | cut -d' ' -f1 || echo 'no-dart')"
          
          # Build cache key based on changes
          if [ "${{ steps.changes.outputs.dart_changed }}" = "true" ] || [ "${{ steps.changes.outputs.config_changed }}" = "true" ]; then
            build_key="build-${{ runner.os }}-$(date +%s)-new"
          else
            build_key="build-${{ runner.os }}-reuse"
          fi
          
          echo "🔑 Generated Keys:"
          echo "Pub Key: $pub_key"
          echo "Gradle Key: $gradle_key"
          echo "Dart Key: $dart_key"
          echo "Build Key: $build_key"
          
          echo "pub_key=$pub_key" >> $GITHUB_OUTPUT
          echo "gradle_key=$gradle_key" >> $GITHUB_OUTPUT
          echo "dart_key=$dart_key" >> $GITHUB_OUTPUT
          echo "build_key=$build_key" >> $GITHUB_OUTPUT
      
      # 🔥 AI-like Decision Engine
      - name: 🧠 AI-like Decision Engine
        id: decide
        run: |
          dart_changed="${{ steps.changes.outputs.dart_changed }}"
          android_changed="${{ steps.changes.outputs.android_changed }}"
          ios_changed="${{ steps.changes.outputs.ios_changed }}"
          native_changed="${{ steps.changes.outputs.native_changed }}"
          config_changed="${{ steps.changes.outputs.config_changed }}"
          strategy="${{ inputs.strategy }}"
          
          echo "🧠 AI-like Decision Engine"
          echo "Strategy: $strategy"
          
          # Ultra intelligent decision making
          if [ "$native_changed" = "true" ]; then
            decision="full_rebuild"
            build_needed="true"
            reason="Native changes detected - full rebuild required"
          elif [ "$dart_changed" = "true" ]; then
            decision="incremental_build"
            build_needed="true"
            reason="Dart changes only - incremental build possible"
          elif [ "$config_changed" = "true" ]; then
            decision="config_refresh"
            build_needed="false"
            reason="Config only - refresh existing artifacts"
          else
            decision="reuse_artifacts"
            build_needed="false"
            reason="No code changes - reuse existing artifacts"
          fi
          
          echo "🎯 Decision: $decision"
          echo "📝 Reason: $reason"
          echo "🔧 Build Needed: $build_needed"
          
          echo "decision=$decision" >> $GITHUB_OUTPUT
          echo "reason=$reason" >> $GITHUB_OUTPUT
          echo "build_needed=$build_needed" >> $GITHUB_OUTPUT
      
      # 🔥 Conditional Cache Restoration
      - name: 📦 Restore Pub Cache
        if: steps.decide.outputs.build_needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ steps.keys.outputs.pub_key }}
      
      - name: 🤖 Restore Gradle Cache
        if: steps.decide.outputs.build_needed == 'true' && contains(inputs.platforms, 'android')
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.keys.outputs.gradle_key }}
      
      - name: 🗂️ Restore Build Cache
        if: steps.decide.outputs.decision == 'reuse_artifacts'
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ steps.keys.outputs.build_key }}
      
      # 🔥 Skip Build if No Changes
      - name: ⚡ Skip Build (Ultra Fast)
        if: steps.decide.outputs.build_needed == 'false'
        run: |
          echo "⚡⚡ ULTRA FAST MODE - No Build Needed! ⚡⚡"
          echo "🎯 Decision: ${{ steps.decide.outputs.decision }}"
          echo "📝 Reason: ${{ steps.decide.outputs.reason }}"
          echo "🚀 Time Saved: 100%"
          exit 0
      
      # 🔥 Smart Build Process
      - name: 🔧 Smart Build Process
        if: steps.decide.outputs.build_needed == 'true'
        run: |
          echo "🚀 Smart Build Started"
          echo "🎯 Strategy: ${{ steps.decide.outputs.decision }}"
          echo "📝 Reason: ${{ steps.decide.outputs.reason }}"
          
          # Simulate smart build
          if [ "${{ steps.decide.outputs.decision }}" = "incremental_build" ]; then
            echo "⚡ Incremental Build - Using existing cache..."
            sleep 2
          elif [ "${{ steps.decide.outputs.decision }}" = "full_rebuild" ]; then
            echo "🔨 Full Rebuild - Native changes detected..."
            sleep 8
          else
            echo "🔄 Config Refresh - Quick update..."
            sleep 1
          fi
          
          echo "✅ Smart Build Completed"
