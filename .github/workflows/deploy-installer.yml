name: Build Installer
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      full_version:
        type: string
        required: true
      exe_name:
        type: string
        required: false
        default: "app.exe"
      app_name:
        type: string
        required: false
        default: "MyApp"
      app_publisher:
        type: string
        required: false
        default: "MyCompany"
    outputs:
      installer_name:
        value: ${{ jobs.build.outputs.installer_name }}
jobs:
  build:
    runs-on: windows-latest
    environment: ${{ inputs.flavor }}
    outputs:
      installer_name: ${{ steps.assets.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - run: git config --system core.longpaths true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: windows-exe-${{ inputs.flavor }}
          path: build/windows/x64/runner/Release/
        continue-on-error: true

      - shell: pwsh
        run: |
          # Check if we have pre-built artifact
          $exePath = "build/windows/x64/runner/Release/*.exe"
          if (Test-Path $exePath) {
            Write-Host "✅ Using pre-built EXE from artifact" -ForegroundColor Green
          } else {
            Write-Host "🔨 Building Windows app..." -ForegroundColor Yellow
            flutter build windows --release --dart-define=ENV=${{ inputs.flavor }}
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "✅ Windows app built" -ForegroundColor Green
          }

      - shell: pwsh
        run: |
          $issPath = "./installers/setup.iss"
          if (Test-Path $issPath) {
            $content = Get-Content $issPath -Raw
            $content = $content -replace "APP_VERSION_PLACEHOLDER", "${{ inputs.full_version }}"
            $content = $content -replace "APP_NAME_PLACEHOLDER", "${{ inputs.app_name }}"
            $content = $content -replace "APP_PUBLISHER_PLACEHOLDER", "${{ inputs.app_publisher }}"
            $content = $content -replace "APP_EXE_PLACEHOLDER", "${{ inputs.exe_name }}"
            $content = $content -replace "APP_GUID_PLACEHOLDER", "$(New-Guid)"
            [System.IO.File]::WriteAllText($issPath, $content)
            Write-Host "✅ Template prepared" -ForegroundColor Green
          } else {
            Write-Host "❌ ISS file not found at $issPath" -ForegroundColor Red
            exit 1
          }

      - shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ./installers/setup.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Inno Setup failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit 1
          }
          Write-Host "✅ Installer built" -ForegroundColor Green

      - shell: pwsh
        id: assets
        run: |
          $name = if ("${{ inputs.flavor }}" -eq "dev") { "abujena_setup_dev.exe" } else { "abujena_setup.exe" }
          echo "installer_name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ./Output/${{ steps.assets.outputs.installer_name }}
          retention-days: 5
