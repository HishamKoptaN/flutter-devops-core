name: Build Installer
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      full_version:
        type: string
        required: true
    outputs:
      installer_name:
        value: ${{ jobs.build.outputs.installer_name }}
jobs:
  build:
    runs-on: windows-latest
    environment: ${{ inputs.flavor }}
    outputs:
      installer_name: ${{ steps.assets.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - run: git config --system core.longpaths true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - shell: pwsh
        run: |
          flutter build windows --release --dart-define=ENV=${{ inputs.flavor }}
          Write-Host "✅ Windows app built" -ForegroundColor Green

      - shell: pwsh
        run: |
          # Debug: List files
          Write-Host "📂 Current directory: $(Get-Location)"
          Get-ChildItem -Force
          if (Test-Path "./installers") {
            Write-Host "📂 Installers directory:"
            Get-ChildItem ./installers/ -Force
          }
          if (Test-Path "./build/windows") {
            Write-Host "📂 Build directory:"
            Get-ChildItem ./build/windows/ -Recurse | Select-Object -First 20
          }

      - shell: pwsh
        run: |
          $issPath = "./installers/setup.iss"
          if (Test-Path $issPath) {
            $content = Get-Content $issPath -Raw
            $newContent = $content -replace "APP_VERSION_PLACEHOLDER", "${{ inputs.full_version }}"
            [System.IO.File]::WriteAllText($issPath, $newContent)
            Write-Host "✅ Template prepared" -ForegroundColor Green
          } else {
            Write-Host "❌ ISS file not found at $issPath" -ForegroundColor Red
            exit 1
          }

      - shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ./installers/setup.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Inno Setup failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit 1
          }
          Write-Host "✅ Installer built" -ForegroundColor Green

      - shell: pwsh
        id: assets
        run: |
          $name = if ("${{ inputs.flavor }}" -eq "dev") { "abujena_setup_dev.exe" } else { "abujena_setup.exe" }
          echo "installer_name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ./Output/${{ steps.assets.outputs.installer_name }}
          retention-days: 5
