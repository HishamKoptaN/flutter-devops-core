name: 20-shorebird-ios.yml
on:
  workflow_call:
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ github.ref_name }}
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
    outputs:
      build_type: ${{ steps.dry_run.outputs.build_type }}
    steps:
      - uses: apple-actions/download-provisioning-profiles@v1
        with:
          bundle-identifier: 'com.muein.orders'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          profile-type: 'IOS_APP_STORE'
