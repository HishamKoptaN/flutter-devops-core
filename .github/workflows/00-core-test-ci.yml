name: Test CI/CD Pipeline

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      flavor:
        type: string
        default: 'dev'
        description: 'Flavor to test'
      build_android:
        type: boolean
        default: true
        description: 'Enable Android build'
      build_windows:
        type: boolean
        default: true
        description: 'Enable Windows build'
      build_ios:
        type: boolean
        default: false
        description: 'Enable iOS build'
      build_linux:
        type: boolean
        default: false
        description: 'Enable Linux build'
      build_macos:
        type: boolean
        default: false
        description: 'Enable macOS build'

permissions:
  contents: write

jobs:
  workflows:
    uses: ./.github/workflows/00-core-main.yml
    with:
      flavor: ${{ inputs.flavor || 'dev' }}
      build_android: ${{ inputs.build_android || true }}
      build_windows: ${{ inputs.build_windows || true }}
      build_ios: ${{ inputs.build_ios || false }}
      build_linux: ${{ inputs.build_linux || false }}
      build_macos: ${{ inputs.build_macos || false }}
    secrets: inherit
