name: 00-main
env:
  force_javascript_actions_to_node24: true
  actions_allow_use_unsecure_node_version: true
permissions:
  contents: write
on:
  workflow_call:
  push:
    branches: [dev, prod]
  workflow_dispatch:
jobs: 
  test-signing:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v6
        - uses: HishamKoptaN/flutter-devops-core/.github/actions/ios/setup-ios-signing@prod
          with:
            appstore_issuer_id: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
            appstore_api_key_id: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
            appstore_api_private_key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
            distribution_private_key: ${{ secrets.DISTRIBUTION_PRIVATE_KEY_BASE64 }}
        - shell: bash
          run: |
            security find-identity -v -p codesigning
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
            echo "تم فحص وتثبيت التوقيع والبروفايل بنجاح!"
