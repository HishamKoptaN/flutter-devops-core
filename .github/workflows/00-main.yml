name: 00-main
env:
  force_javascript_actions_to_node24: true
  actions_allow_use_unsecure_node_version: true
permissions:
  contents: write
on:
  workflow_call:
  push:
    branches: [dev, prod]
  workflow_dispatch:
jobs: 
  test-signing:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v6
        - uses: ./.github/actions/setup-ios-signing
          with:
            appstore_issuer_id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
            appstore_api_key_id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
            appstore_api_private_key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
            distribution_private_key: ${{ secrets.IOS_DISTRIBUTION_PRIVATE_KEY }}
            bundle_id: 'com.muein_orders'
        - shell: bash
          run: |
            security find-identity -v -p codesigning
            ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
            echo "تم فحص وتثبيت التوقيع والبروفايل بنجاح!"
