name: 00-main
env:
  force_javascript_actions_to_node24: true
  actions_allow_use_unsecure_node_version: true
permissions:
  contents: write
on:
  workflow_call:
  push:
    branches: [dev, prod]
  workflow_dispatch:
jobs: 
  # shorebird_layer:
  #   uses: ./.github/workflows/20-shorebird-layer.yml
  #   secrets: inherit
  test_certificate:
    runs-on: macos-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name }}
    
    steps:
      - uses: actions/checkout@v4
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/ios/setup-ios-signing@prod
        with:
          appstore_issuer_id: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          appstore_api_key_id: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          appstore_api_private_key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          distribution_private_key: ${{ secrets.DISTRIBUTION_PRIVATE_KEY_BASE64 }}