name: 20-shorebird-ios-patch.yml

on:
  workflow_call:
    inputs:
      shorebird_app_id:
        type: string
        required: true  
    secrets:
      SHOREBIRD_TOKEN:
        required: true
jobs:
  patch:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /Users/runner/hostedtoolcache/flutter
          key: flutter-sdk
          restore-keys: flutter-sdk-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: "stable"
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock') }}-macos
          restore-keys: flutter-deps-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-macos-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: shorebird-macos-
      - uses: actions/cache@v4
        with:
          path: |
            build/
            ios/Pods
            ios/.symlinks
          key: ios-patch-${{ github.sha }}-${{ inputs.version_code }}-macos
          restore-keys: ios-patch-macos-
      - run: flutter pub get
      - run: |
          cd ios
          pod install --repo-update
      - env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird patch ios \
            --dart-define=ENV=prod \
            --flavor=prod 
