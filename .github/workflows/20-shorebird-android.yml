name: 20-shorebird-android

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      shorebird_app_id:
        type: string
        required: true  
      use_patch:
        type: boolean
        required: false
        default: true
    
    outputs:
      changed:
        value: ${{ jobs.shorebird_patch.outputs.changed || jobs.shorebird_release.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false
jobs:
  shorebird_patch:
    if: ${{ inputs.use_patch }}
    uses: ./.github/workflows/21-shorebird-android-patch.yml
    with:
      flavor: ${{ inputs.flavor }}
      shorebird_app_id: ${{ inputs.shorebird_app_id }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  shorebird_release:
    needs: [shorebird_patch]
    if: ${{ always() && (needs.shorebird_patch.result == 'failure' || inputs.use_patch == false) }}
    uses: ./.github/workflows/22-shorebird-android-release.yml
    with:
      flavor: ${{ inputs.flavor }}
      shorebird_app_id: ${{ inputs.shorebird_app_id }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}




