name: Deploy Android Shorebird (Clean)

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      full_version:
        type: string
        required: true
      base_version:
        type: string
        required: true
      build_apk:
        type: boolean
        default: true
      build_aab:
        type: boolean
        default: true
    outputs:
      changed:
        value: ${{ jobs.shorebird.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  shorebird:
    uses: ./.github/workflows/20-shorebird-android-core.yml
    with:
      flavor: ${{ inputs.flavor }}
      base_version: ${{ inputs.base_version }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
