name: 20-shorebird-android

on:
  workflow_call:
    inputs:
      shorebird_app_id:
        type: string
        required: true
    secrets:
      SHOREBIRD_TOKEN:
        required: true
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false    

jobs:
  check:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    outputs:
      build_type: ${{ steps.dry_run.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true 
      - id: dry_run
        uses: HishamKoptaN/flutter-devops-core/.github/actions/shorebird-dry-patch@prod
        with:
          platform: 'android'
          shorebird_token: ${{ secrets.SHOREBIRD_TOKEN }}
  shorebird_patch:
    needs: check
    if: ${{ needs.check.outputs.build_type == 'patch' }}
    uses: ./.github/workflows/20-shorebird-android-patch.yml
    with:
      shorebird_app_id: ${{ inputs.shorebird_app_id }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  shorebird_release:
    needs: check
    if: ${{ needs.check.outputs.build_type == 'release' }}
    uses: ./.github/workflows/30-shorebird-android-release.yml
    with:
      shorebird_app_id: ${{ inputs.shorebird_app_id }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}