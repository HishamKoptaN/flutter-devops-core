name: 20-shorebird-android
on:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    outputs:
      build_type: ${{ steps.dry_run.outputs.build_type }}
    steps:
      - uses: actions/checkout@v6
        with:
         fetch-depth: 1
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/core/setup-flutter@prod
     
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/core/setup-shorebird@prod
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/android/android-signing@prod
        with:
          FLAVOR: ${{ github.ref_name }}
      - uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os}}-${{ github.ref_name }}    
      - shell: bash 
        run: |
         sed -i "s/^app_id:.*/app_id: "${{ vars.SHOREBIRD_APP_ID }}"/" shorebird.yaml   
      - id: dry_run
        uses: HishamKoptaN/flutter-devops-core/.github/actions/android/shorebird-android-dry-patch@prod
      - if: ${{ steps.dry_run.outputs.build_type == 'patch' }}
        uses: HishamKoptaN/flutter-devops-core/.github/actions/android/shorebird-android-patch@prod
        with:
          FLAVOR: ${{ github.ref_name }}
      - if: ${{ steps.dry_run.outputs.build_type == 'release' }}
        uses: HishamKoptaN/flutter-devops-core/.github/actions/android/shorebird-android-release@prod
        with:
          shorebird_app_id: ${{ vars.SHOREBIRD_APP_ID }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          track: internal