name: Build Android Artifacts

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      build_apk:
        type: boolean
        default: true
      build_aab:
        type: boolean
        default: true
    outputs:
      apk_path:
        value: ${{ jobs.build.outputs.apk_path }}
      aab_path:
        value: ${{ jobs.build.outputs.aab_path }}
      artifacts_uploaded:
        value: ${{ jobs.build.outputs.artifacts_uploaded }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      aab_path: ${{ steps.build.outputs.aab_path }}
      artifacts_uploaded: ${{ steps.upload.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - id: build
        run: |
          echo "🔧 Building Android artifacts for flavor: ${{ inputs.flavor }}"
          
          apk_path=""
          aab_path=""
          
          # Build APK
          if [ "${{ inputs.build_apk }}" = "true" ]; then
            echo "📱 Building APK..."
            flutter build apk --release --dart-define=ENV=${{ inputs.flavor }}
            if [ $? -eq 0 ]; then
              apk_path="build/app/outputs/flutter-apk/app-release.apk"
              echo "✅ APK built successfully"
              echo "apk_path=$apk_path" >> $GITHUB_OUTPUT
            else
              echo "❌ APK build failed"
              exit 1
            fi
          fi
          
          # Build AAB
          if [ "${{ inputs.build_aab }}" = "true" ]; then
            echo "📦 Building AAB..."
            flutter build appbundle --release --dart-define=ENV=${{ inputs.flavor }}
            if [ $? -eq 0 ]; then
              aab_path="build/app/outputs/bundle/release/app-release.aab"
              echo "✅ AAB built successfully"
              echo "aab_path=$aab_path" >> $GITHUB_OUTPUT
            else
              echo "❌ AAB build failed"
              exit 1
            fi
          fi

      - id: upload
        run: |
          echo "📤 Uploading artifacts..."
          uploaded="false"
          
          # Upload APK
          if [ -n "${{ steps.build.outputs.apk_path }}" ] && [ -f "${{ steps.build.outputs.apk_path }}" ]; then
            echo "Uploading APK artifact..."
            # This will be handled by actions/upload-artifact below
            uploaded="true"
          fi
          
          # Upload AAB
          if [ -n "${{ steps.build.outputs.aab_path }}" ] && [ -f "${{ steps.build.outputs.aab_path }}" ]; then
            echo "Uploading AAB artifact..."
            # This will be handled by actions/upload-artifact below
            uploaded="true"
          fi
          
          echo "uploaded=$uploaded" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        if: inputs.build_apk && steps.build.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.flavor }}
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 30

      - name: Upload AAB Artifact
        if: inputs.build_aab && steps.build.outputs.aab_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ inputs.flavor }}
          path: ${{ steps.build.outputs.aab_path }}
          retention-days: 30
