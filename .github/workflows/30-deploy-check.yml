name: Deploy Platform Check
on:
  workflow_call:
    inputs:
      platforms:
        type: string
        required: false
        default: ""
    outputs:
      android_built:
        value: ${{ jobs.check.outputs.android_built }}
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      android_built: ${{ steps.platforms.outputs.android_built }}
    steps:
      - id: platforms
        run: |
          android_enabled="false"
          if [[ "${{ inputs.platforms }}" == *"android"* ]]; then
            android_enabled="true"
          fi
          echo "android_built=$android_enabled" >> $GITHUB_OUTPUT
