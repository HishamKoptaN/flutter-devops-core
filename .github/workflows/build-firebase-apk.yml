name: Distribute APK to Firebase

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: false
        default: "dev"
    secrets:
      FIREBASE_ADMIN_SDK:
        required: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ inputs.flavor }}
          path: build/app/outputs/flutter-apk/
        continue-on-error: true

      - name: Find APK by Pattern
        id: find_apk
        run: |
          echo " Looking for APK files..."

          # Try specific flavor first
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" -type f 2>/dev/null | head -1)

          # If not found, try listing all artifacts
          if [ -z "$APK_PATH" ]; then
            echo " No APK in expected path, searching all artifacts..."
            ls -la build/app/outputs/ 2>/dev/null || echo "No outputs directory"
            APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo " No APK file found"
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo " Found APK: $APK_PATH"

      - name: Extract Firebase App ID
        id: get_app_id
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "⚠️ google-services.json not found, skipping Firebase"
            echo "app_id=" >> $GITHUB_OUTPUT
            exit 0
          fi
          APP_ID=$(grep -o '"mobilesdk_app_id": "[^"]*"' android/app/google-services.json | sed 's/.*"mobilesdk_app_id": "\([^"]*\)".*/\1/')
          if [ -z "$APP_ID" ]; then
            echo "❌ Could not find mobilesdk_app_id in google-services.json"
            exit 1
          fi
          echo "Found Firebase App ID: $APP_ID"
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT

      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        if: steps.get_app_id.outputs.app_id != ''
        with:
          appId: ${{ steps.get_app_id.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_ADMIN_SDK }}
          groups: "apk"
          file: ${{ steps.find_apk.outputs.apk_path }}
        continue-on-error: true

      - name: Check Firebase Result
        run: |
          if [ -z "${{ secrets.FIREBASE_ADMIN_SDK }}" ]; then
            echo "⚠️ FIREBASE_ADMIN_SDK not provided, skipping Firebase distribution"
            echo "📦 APK is available at: ${{ steps.find_apk.outputs.apk_path }}"
          else
            echo "✅ Firebase distribution attempted"
          fi
