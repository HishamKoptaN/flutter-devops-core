name: Main
on:
    workflow_call:
    push:
        branches: [dev, prod]
    workflow_dispatch:
jobs:
    check_platforms:
        uses: ./.github/workflows/check-platforms.yml
    deploy_shorebird:
        needs: check_platforms
        permissions:
            contents: write
        uses: ./.github/workflows/deploy-shorebird.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
        secrets: inherit
    build_firebase_apk:
        needs: [check_platforms, deploy_shorebird]
        if: always() && needs.check_platforms.outputs.android_exists == 'true' && (needs.deploy_shorebird.outputs.version_changed == 'true' || needs.deploy_shorebird.result == 'success')
        uses: ./.github/workflows/build-firebase-apk.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
        secrets: inherit

    windows_shorebird:
        needs: check_platforms
        if: needs.check_platforms.outputs.windows_exists == 'true'
        uses: ./.github/workflows/deploy-windows-shorebird.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
            full_version: ${{ needs.deploy_shorebird.outputs.full_version }}
        secrets: inherit
    windows_build:
        needs: [check_platforms, windows_shorebird]
        if: needs.check_platforms.outputs.windows_exists == 'true'
        uses: ./.github/workflows/build-windows-exe.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
    windows_upload:
        needs: [windows_shorebird, windows_build]
        if: needs.check_platforms.outputs.windows_exists == 'true'
        permissions:
            contents: write
        uses: ./.github/workflows/upload-windows-release.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
            full_version: ${{ needs.deploy_shorebird.outputs.full_version }}
            exe_path: ${{ needs.windows_build.outputs.exe_path }}
    build_installer:
        needs: [windows_build]
        if: needs.check_platforms.outputs.windows_exists == 'true'
        uses: ./.github/workflows/deploy-installer.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
            full_version: ${{ needs.deploy_shorebird.outputs.full_version }}
    github_release:
        needs: [deploy_shorebird, build_installer]
        uses: ./.github/workflows/deploy-release.yml
        secrets: inherit
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
            full_version: ${{ needs.deploy_shorebird.outputs.full_version }}
            version_changed: ${{ needs.deploy_shorebird.outputs.version_changed }}
            installer_name: ${{ needs.build_installer.outputs.installer_name }}
    cleanup_releases:
        needs: github_release
        uses: ./.github/workflows/cleanup-releases.yml
        secrets: inherit
    distribute_android:
        needs: [check_platforms, deploy_shorebird]
        if: needs.check_platforms.outputs.android_exists == 'true' && needs.deploy_shorebird.outputs.version_changed == 'true'
        uses: ./.github/workflows/distribute-android.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
        secrets: inherit
