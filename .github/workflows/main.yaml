name: Main
on:
    workflow_call:
    push:
        branches: [dev, prod]
    workflow_dispatch:
jobs:
    deploy_shorebird:
        permissions:
            contents: write
        uses: ./.github/workflows/deploy-shorebird.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
        secrets: inherit
    build_firebase_apk:
        needs: deploy_shorebird
        if: always() && hashFiles('android/**') != '' && (needs.deploy_shorebird.outputs.version_changed == 'true' || needs.deploy_shorebird.result == 'success')
        uses: ./.github/workflows/build-firebase-apk.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
        secrets: inherit
    windows_shorebird:
        needs: deploy_shorebird
        if: hashFiles('windows/CMakeLists.txt') != ''
        uses: ./.github/workflows/deploy-windows-shorebird.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
            full_version: ${{ needs.deploy_shorebird.outputs.full_version }}
        secrets: inherit
    windows_build:
        needs: windows_shorebird
        if: hashFiles('windows/CMakeLists.txt') != ''
        uses: ./.github/workflows/build-windows-exe.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
    windows_upload:
        needs: [windows_shorebird, windows_build]
        if: hashFiles('windows/CMakeLists.txt') != ''
        permissions:
            contents: write
        uses: ./.github/workflows/upload-windows-release.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
            full_version: ${{ needs.deploy_shorebird.outputs.full_version }}
            exe_path: ${{ needs.windows_build.outputs.exe_path }}
    build_installer:
        needs: [windows_build, deploy_shorebird]
        if: hashFiles('windows/CMakeLists.txt') != ''
        uses: ./.github/workflows/deploy-installer.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
            full_version: ${{ needs.deploy_shorebird.outputs.full_version }}
            exe_name: ${{ needs.windows_build.outputs.exe_name }}
            app_name: "Abujena"
            app_publisher: "Abujena Dawajen"
    github_release:
        needs: [deploy_shorebird, build_installer]
        permissions:
            contents: write
        uses: ./.github/workflows/deploy-release.yml
        secrets: inherit
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
            full_version: ${{ needs.deploy_shorebird.outputs.full_version }}
            version_changed: ${{ needs.deploy_shorebird.outputs.version_changed }}
            installer_name: ${{ needs.build_installer.outputs.installer_name }}
    cleanup_releases:
        needs: github_release
        if: always()
        uses: ./.github/workflows/cleanup-releases.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
        secrets:
            FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    distribute_android:
        needs: deploy_shorebird
        if: hashFiles('android/**') != '' && needs.deploy_shorebird.outputs.version_changed == 'true'
        uses: ./.github/workflows/distribute-android.yml
        with:
            flavor: ${{ inputs.flavor || github.ref_name }}
        secrets: inherit