name: Test Windows Shorebird Build
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: git config --system core.longpaths true
      - shell: pwsh
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release windows --flutter-version=3.29.3 --flavor=${{ inputs.flavor }} --artifact=exe --no-confirm --verbose 2>&1 | Tee-Object -FilePath /tmp/shorebird_output
          if (Select-String -Path /tmp/shorebird_output -Pattern "SHOREBIRD_TOKEN not set") {
            Write-Host "❌ SHOREBIRD_TOKEN is not set"
            exit 1
          }
          if (Select-String -Path /tmp/shorebird_output -Pattern "Exception|Error|error|Failed") {
            Write-Host "❌ Build failed with errors"
            exit 1
          }
          Write-Host "✅ Shorebird build succeeded"
      - shell: pwsh
        run: |
          $flavor = "${{ inputs.flavor }}"
          $basePath = "build/windows/x64/runner/Release"
          $files = Get-ChildItem -Path $basePath -Filter "*.exe" -File
          if ($flavor -eq "dev") {
            $newName = "abujena_windows_dev.exe"
          } else {
            $newName = "abujena_windows.exe"
          }
          if ($files.Count -gt 0) {
            Rename-Item -Path $files[0].FullName -NewName $newName
            Write-Host "✅ Renamed executable to $newName"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ inputs.flavor }}
          path: build/windows/x64/runner/Release/*.exe
          retention-days: 5
