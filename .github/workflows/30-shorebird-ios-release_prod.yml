name: 30-shorebird-ios-release_prod.yml
on:
  workflow_call:
jobs:
  ios:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}
    env:
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/core/setup-flutter@prod
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/core/setup-shorebird@prod
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/ios/setup-ios-signing@prod
        with:
          p12-password: ${{ secrets.P12_PASSWORD }}
          appstore_issuer_id: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          appstore_api_key_id: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          appstore_api_private_key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ios-pods-${{ hashFiles('ios/Podfile.lock') }}-${{ runner.os }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/swift-package-manager
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-pods-swift-${{ hashFiles('ios/Podfile.lock') }}
      - uses: actions/cache@v4
        with:
          path: |
            build/
            .dart_tool/
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/Podfile.lock') }}
      - run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ios/SourcePackages
          rm -rf ~/Library/Caches/com.apple.dt.Xcode           
      - run: flutter pub get
        shell: bash
      - run: |
          cd ios
          pod install
        shell: bash
      - id: get-build-version
        uses: HishamKoptaN/flutter-devops-core/.github/actions/core/get-build-version@prod
        with:
            platform: "ios"
            shorebird_app_id: ${{ vars.SHOREBIRD_APP_ID }}
      - run: |
              shorebird release ios \
              --flutter-version=3.44.7 \
              --flavor=${{ github.ref_name }} \
              --dart-define=ENV=${{ github.ref_name }} \
              --build-name=${{ steps.get-build-version.outputs.build_name }} \
              --build-number=${{ steps.get-build-version.outputs.build_number }} \
              --target=lib/main.dart \
              --export-options-plist=ios/ExportOptions.plist \
              --confirm
      - id: find_ipa
        run: |
            IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
            echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
      - uses: apple-actions/upload-testflight-build@v4
        with:
           app-path: 'build/ios/ipa/*.ipa'
           issuer-id: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
           api-key-id: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
           api-private-key: ${{ vars.APP_STORE_CONNECT_API_PRIVATE_KEY }}
           backend: altool
           