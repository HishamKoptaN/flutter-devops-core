name: 30-shorebird-ios-release_dev.yml
on:
  workflow_call:
    inputs:
      shorebird_app_id:
        type: string
        required: true
      
jobs:
  ios:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}
    env:
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/setup-ios-shorebird@prod
        with:
          p12_password: ${{ secrets.P12_PASSWORD }}
          shorebird_token: ${{ secrets.SHOREBIRD_TOKEN }}
      - env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import ios/certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security find-identity -v -p codesigning

      - id: get-build-version
        uses: HishamKoptaN/flutter-devops-core/.github/actions/get-build-version@prod
        with:
          platform: "ios"
          shorebird_app_id: ${{ inputs.shorebird_app_id }}
      - run: |
            shorebird release ios \
            --flavor=${{ github.ref_name }} \
            --dart-define=ENV=${{ github.ref_name }} \
            --build-name=${{ steps.get-build-version.outputs.build_name }} \
            --build-number=${{ steps.get-build-version.outputs.build_number }} \
            --target=lib/main.dart \
            --confirm \ 
            --verbose
      - uses: apple-actions/upload-testflight-build@v3
        with:
           app-path: 'build/ios/ipa/muein_orders.ipa'
           issuer-id: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
           api-key-id: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
           api-private-key: ${{ vars.APP_STORE_CONNECT_API_PRIVATE_KEY }}