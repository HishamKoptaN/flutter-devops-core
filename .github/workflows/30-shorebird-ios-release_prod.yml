name: 30-shorebird-ios-release_dev.yml
on:
  workflow_call:
    inputs:
      shorebird_app_id:
        type: string
        required: true
jobs:
  ios:
    runs-on: macos-latest
    environment: ${{ github.ref_name }}
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - id: get-build-version
        uses: HishamKoptaN/flutter-devops-core/.github/actions/get-build-version@prod
        with:
          platform: "ios"
          shorebird_app_id: ${{ inputs.shorebird_app_id }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: cd ios && pod install
      - run: ls -la ios/*.p12 ios/*.mobileprovision
      - run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          security create-keychain -p "" build.keychain
          security import ios/certificate.p12 -k build.keychain -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -s build.keychain
          security find-identity -v -p codesigning
      - run: |
            shorebird release ios \
            --flavor=${{ github.ref_name }} \
            --dart-define=ENV=${{ github.ref_name }} \
            --build-name=${{ steps.get-build-version.outputs.build_name }} \
            --build-number=${{ steps.get-build-version.outputs.build_number }} \
            --confirm
