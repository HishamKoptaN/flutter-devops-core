name: Build Layer

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      platforms:
        type: string
        required: false
        default: ""
jobs:
  build_web:
    if: contains(inputs.platforms, 'web')
    uses: ./.github/workflows/40-build-web.yml
    with:
      flavor: ${{ inputs.flavor }}
    secrets: inherit
