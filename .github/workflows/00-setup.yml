name: Setup

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      platforms:
        type: string
        required: false
        default: ""
        description: "Comma-separated platforms to build (e.g., android,windows)"
    outputs:
      flavor:
        value: ${{ jobs.setup.outputs.flavor }}
      version_changed:
        value: ${{ jobs.setup.outputs.version_changed }}
      android_enabled:
        value: ${{ jobs.setup.outputs.android_enabled }}
      windows_enabled:
        value: ${{ jobs.setup.outputs.windows_enabled }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      flavor: ${{ steps.set.outputs.flavor }}
      android_enabled: ${{ steps.set.outputs.android_enabled }}
      windows_enabled: ${{ steps.set.outputs.windows_enabled }}
      version_changed: ${{ steps.set.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          flavor="${{ inputs.flavor }}"
          echo "flavor=$flavor" >> $GITHUB_OUTPUT
          platforms="${{ inputs.platforms }}"
          android_enabled="false"
          windows_enabled="false"
          if echo "$platforms" | grep -qi "android"; then
            android_enabled="true"
          fi
          if echo "$platforms" | grep -qi "windows"; then
            windows_enabled="true"
          fi
          echo "android_enabled=$android_enabled" >> $GITHUB_OUTPUT
          echo "windows_enabled=$windows_enabled" >> $GITHUB_OUTPUT
          echo "version_changed=true" >> $GITHUB_OUTPUT
