name: Shorebird Linux Deploy

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      full_version:
        type: string
        required: true
      base_version:
        type: string
        required: false
      use_patch:
        type: boolean
        required: false
        default: false
    outputs:
      release_completed:
        value: ${{ jobs.shorebird.outputs.release_completed }}
      patch_completed:
        value: ${{ jobs.shorebird.outputs.patch_completed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  shorebird:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    outputs:
      release_completed: ${{ steps.deploy.outputs.release_completed }}
      patch_completed: ${{ steps.deploy.outputs.patch_completed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - id: deploy
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          TARGET_ID=$(if [ "${{ inputs.flavor }}" = "prod" ]; then echo "linux-prod-id"; else echo "linux-dev-id"; fi)
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          release_completed="false"
          patch_completed="false"
          
          if shorebird release linux --dart-define=ENV=${{ inputs.flavor }} --no-tree-shake-icons 2>&1 | tee release.log; then
            release_completed="true"
          else
            exit 1
          fi
          
          echo "release_completed=$release_completed" >> $GITHUB_OUTPUT
          echo "patch_completed=$patch_completed" >> $GITHUB_OUTPUT
