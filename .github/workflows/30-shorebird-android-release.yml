name: 30-shorebird-android-release.yml
on:
  workflow_call:
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref_name }}
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/android/setup-android-shorebird@prod
      - id: get-build-version
        uses: HishamKoptaN/flutter-devops-core/.github/actions/core/get-build-version@prod
        with:
          platform: "android"
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/cache-flutter-android@prod
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
          local-cache: true
      - id: run
        run: |
          flavor="${{ github.ref_name }}"
          shorebird release android \
          --flavor=$flavor \
          --build-name=${{ steps.get-build-version.outputs.build_name }} \
          --build-number=${{ steps.get-build-version.outputs.build_number }} \
          --dart-define=ENV=$flavor \
          --artifact=apk \
          --target-platform=android-arm,android-arm64 \
          -- \
          --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: build/app/outputs/**/*.apk
          retention-days: 1

