name: 30-shorebird-android-release
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      shorebird_app_id:
        type: string
        required: true  
      track:
        required: false
        type: string
        default: "internal"
    outputs:
      changed:
        value: ${{ jobs.release.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
     TRACK: ${{ inputs.track }} 
    environment: ${{ inputs.flavor }}
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock', '**/pubspec.yaml') }}-${{ runner.os }}
          restore-keys: |
            flutter-deps-${{ hashFiles('pubspec.lock') }}-
            flutter-deps-
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts', 'android/build.gradle.kts') }}
          restore-keys: android-sdk-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'android/gradle.properties') }}-${{ runner.os }}
          restore-keys: |
            gradle-${{ hashFiles('**/*.gradle*') }}-${{ runner.os }}-
            gradle-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: |
            shorebird-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-
            shorebird-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - uses: actions/cache@v4
        with:
          path: |
            build/
            android/.gradle
            android/app/build
            .dart_tool/build
          key: build-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}-${{ runner.os }}
          restore-keys: |
            build-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}-
            build-${{ runner.os }}-
      - if: steps.run.outputs.env == 'prod'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/muein_orders.jks
      - if: steps.run.outputs.env == 'prod'
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=muein_orders.jks
          EOF
      - id: run
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          flavor="${{ inputs.flavor }}"
          TARGET_ID="${{ inputs.shorebird_app_id }}"
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          latest_version=$(shorebird releases list --platform=android 2>/dev/null | grep 'android' | head -n 1 | awk '{print $2}')
          if [ -z "$latest_version" ]; then
            BUILD_NAME="1.0.0"
            BUILD_NUMBER="1"
          else
            raw_base=$(echo "$latest_version" | cut -d'+' -f1)
            BUILD_NAME=$(echo "$raw_base" | cut -d'-' -f1)
            raw_build=$(echo "$latest_version" | grep -q '+' && echo "$latest_version" | cut -d'+' -f2 || echo "0")
            BUILD_NUMBER=$((raw_build + 1))
          fi
          if steps.run.outputs.env == 'dev' \
          --flavor=$flavor \
          --build-name=$BUILD_NAME \
          --build-number=$BUILD_NUMBER \
          --dart-define=ENV=$flavor \
          --artifact=apk \
          '--' --no-tree-shake-icons; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            shorebird release android \
            --flavor=prod \
            --dart-define=ENV=prod \
            --confirm
            echo "release_built=true" >> $GITHUB_OUTPUT
            exit 1
          fi
      - if: steps.run.outputs.env == 'prod'
        id: upload-play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.muein.orders
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ env.TRACK }}
          status: ${{ env.TRACK == 'production' && 'completed' || 'draft' }}
      - if: |
          success() && 
          steps.run.outputs.env == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.flavor }}
          path: build/app/outputs/**/*.apk
          retention-days: 1