name: 20-shorebird-android-patch.yml
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      shorebird_app_id:
        type: string
        required: true  
    outputs:
      changed:
        value: ${{ jobs.patch.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  patch:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-${{ runner.os }}
          restore-keys: flutter-sdk-
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}
          restore-keys: flutter-deps-   
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: shorebird-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            build/
            .dart_tool/build
          key: patch-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}-${{ runner.os }}
          restore-keys: |
            patch-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}-
            patch-${{ runner.os }}-
            patch-${{ runner.os }}-  
      - run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/muein_orders.jks
      - run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=muein_orders.jks
          EOF   
      - id: verify
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        continue-on-error: true
        run: |
          flavor="${{ inputs.flavor }}"
          TARGET_ID="${{ inputs.shorebird_app_id }}"
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          if shorebird patch android --flavor=$flavor --release-version=latest --dart-define=ENV=$flavor '--' --no-tree-shake-icons; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            exit 1
          fi
      - if: always()
        run: rm -f android/app/muein_orders.jks android/key.properties