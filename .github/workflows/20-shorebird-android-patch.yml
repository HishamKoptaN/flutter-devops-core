name: 20-shorebird-android-patch.yml
on:
  workflow_call:
    inputs:
      shorebird_app_id:
        type: string
        required: true  
    outputs:
      changed:
        value: ${{ jobs.patch.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  patch:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    outputs:
      changed: ${{ steps.verify.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: extract_flutter
        run: |
          FLUTTER_VER=$(grep -A 5 "environment:" pubspec.yaml | grep "flutter:" | sed 's/.*flutter:[ "]*\([^"\']*\)[ "']*$/\1/' | tr -d "\"'^>=")
          echo "FLUTTER_VERSION=${FLUTTER_VER:-stable}" >> $GITHUB_ENV
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/setup-android-shorebird@prod
        with:
          flutter_version: ${{ steps.extract_flutter.outputs.version }}
      - run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/muein_orders.jks
      - run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=muein_orders.jks
          EOF   
      - id: verify
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        continue-on-error: true
        run: |
          flavor="${{ github.ref_name }}"
          TARGET_ID="${{ inputs.shorebird_app_id }}"
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          if shorebird patch android \
          --flavor=$flavor \
          --release-version=latest \
          --flutter-version=$FLUTTER_VER \
          --dart-define=ENV=$flavor '--' --no-tree-shake-icons; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            exit 1
          fi
      - if: always()
        run: rm -f android/app/muein_orders.jks android/key.properties