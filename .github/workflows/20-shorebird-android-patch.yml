name: 20-shorebird-android-patch.yml
on:
  workflow_call:
    inputs:
      shorebird_app_id:
        type: string
        required: true  
jobs:
  patch:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/muein_orders.jks
      - run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=muein_orders.jks
          EOF   
      - id: verify
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        continue-on-error: true
        run: |
          flavor="${{ github.ref_name }}"
          TARGET_ID="${{ inputs.shorebird_app_id }}"
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          if shorebird patch android \
          --flavor=$flavor \
          --release-version=latest \
          --dart-define=ENV=$flavor '--' --no-tree-shake-icons; then
          else
            exit 1
          fi
      - if: always()
        run: rm -f android/app/muein_orders.jks android/key.properties