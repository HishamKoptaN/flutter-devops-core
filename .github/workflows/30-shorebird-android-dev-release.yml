name: 30-shorebird-android-dev-release
on:
  workflow_call:
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref_name }}
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/android/setup-android-shorebird
      - id: get-build-version
        uses: ./.github/actions/core/get-build-version
        with:
          platform: "android"
      - id: run
        run: |
          flavor="${{ github.ref_name }}"
          TARGET_ID="${{ vars.SHOREBIRD_APP_ID }}"
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          shorebird release android \
          --flavor=$flavor \
          --build-name=${{ steps.get-build-version.outputs.build_name }} \
          --build-number=${{ steps.get-build-version.outputs.build_number }} \
          --dart-define=ENV=$flavor \
          --artifact=apk \
          -- \
          --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: build/app/outputs/**/*.apk
          retention-days: 1


