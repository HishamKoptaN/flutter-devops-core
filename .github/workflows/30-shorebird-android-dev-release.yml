name: 30-shorebird-android-dev-release
on:
  workflow_call:
    inputs:
      shorebird_app_id:
        type: string
        required: true  
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/setup-android-shorebird@prod
      - id: get-build-version
        uses: HishamKoptaN/flutter-devops-core/.github/actions/get-build-version@prod
        with:
          shorebird_app_id: ${{ inputs.shorebird_app_id }}
      - id: run
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          flavor="${{ github.ref_name }}"
          TARGET_ID="${{ inputs.shorebird_app_id }}"
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          shorebird release android \
          --flavor=$flavor \
          --build-name=${{ steps.get-build-version.outputs.build_name }} \
          --build-number=${{ steps.get-build-version.outputs.build_number }} \
          --dart-define=ENV=$flavor \
          --artifact=apk \
          '--' --no-tree-shake-icons;
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: build/app/outputs/**/*.apk
          retention-days: 1





