name: Deploy Windows Shorebird

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      full_version:
        type: string
        required: true
      base_version:
        type: string
        required: false
      use_patch:
        type: boolean
        required: false
        default: true
    outputs:
      changed:
        value: ${{ jobs.shorebird.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  shorebird:
    runs-on: windows-latest
    environment: ${{ inputs.flavor }}
    outputs:
      changed: ${{ steps.deploy.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: git config --global core.longpaths true

      - run: flutter config --enable-windows-desktop

      - run: flutter create .

      - run: flutter pub get

      - run: |
          # Clean CMake cache to avoid generator mismatch
          if (Test-Path "build\windows\CMakeCache.txt") {
            Remove-Item "build\windows\CMakeCache.txt" -Force
          }
          if (Test-Path "build\windows\CMakeFiles") {
            Remove-Item "build\windows\CMakeFiles" -Recurse -Force
          }
        shell: pwsh

      - id: deploy
        shell: pwsh
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          $flavor = "${{ inputs.flavor }}"
          $baseVersion = "${{ inputs.base_version }}"
          $usePatch = "${{ inputs.use_patch }}"
          $TARGET_ID = if ($flavor -eq "prod") { "ed427ccb-5edb-4594-a376-2ee9636bef4e" } else { "e962126d-ee7a-48f2-b89d-fb0349f4a05f" }
          (Get-Content shorebird.yaml) -replace '^app_id:.*', "app_id: $TARGET_ID" | Set-Content shorebird.yaml

          $versionChanged = $false
          
          if ($usePatch -eq "true") {
            shorebird patch windows --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | Tee-Object -Variable patchOutput
            $patchExitCode = $LASTEXITCODE

            if ($patchExitCode -ne 0) {
              if ($patchOutput -match "Release not found|No release exists|UnpatchableChangeException|asset changes") {
                shorebird release windows --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | Tee-Object -Variable releaseOutput
                $releaseExitCode = $LASTEXITCODE
                if ($releaseExitCode -ne 0) {
                  if ($releaseOutput -match "existing.*release|already exists") {
                    $versionChanged = $false
                  } else {
                    exit 1
                  }
                } else {
                  $versionChanged = $true
                }
              } else {
                exit 1
              }
            } else {
              $versionChanged = $false
            }
          } else {
            shorebird release windows --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | Tee-Object -Variable releaseOutput
            $releaseExitCode = $LASTEXITCODE
            if ($releaseExitCode -ne 0) {
              if ($releaseOutput -match "existing.*release|already exists") {
                $versionChanged = $false
              } else {
                exit 1
              }
            } else {
              $versionChanged = $true
            }
          }
          echo "changed=$versionChanged" >> $env:GITHUB_OUTPUT

      - id: find_build
        run: |
          $outputPath = "build\windows\x64\runner\Release"
          if (Test-Path $outputPath) {
            echo "Found path: $outputPath"
            echo "path=$outputPath" >> $env:GITHUB_OUTPUT
          } else {
            $outputPath = "build\windows\runner\Release"
            echo "Using fallback path: $outputPath"
            echo "path=$outputPath" >> $env:GITHUB_OUTPUT
          }
          Get-ChildItem $outputPath
        shell: pwsh

      - id: rename
        run: |
          $flavor = "${{ inputs.flavor }}"
          $basePath = "${{ steps.find_build.outputs.path }}"
          $files = Get-ChildItem -Path $basePath -Filter "*.exe" -File
          if ($flavor -eq "dev") {
            $newName = "abujena_windows_dev.exe"
          } else {
            $newName = "abujena_windows.exe"
          }
          if ($files.Count -gt 0) {
            Rename-Item -Path $files[0].FullName -NewName $newName
            Write-Host "✅ Renamed executable to $newName"
            echo "exe_name=$newName" >> $env:GITHUB_OUTPUT
          } else {
            echo "exe_name=app.exe" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ inputs.flavor }}
          path: ${{ steps.find_build.outputs.path }}/*.exe
          retention-days: 5
