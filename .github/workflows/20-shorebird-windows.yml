name: Deploy Windows Shorebird

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      full_version:
        type: string
        required: true
      base_version:
        type: string
        required: false
      use_patch:
        type: boolean
        required: false
        default: true
    outputs:
      changed:
        value: ${{ jobs.shorebird.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false

jobs:
  shorebird:
    runs-on: windows-latest
    environment: ${{ inputs.flavor }}
    outputs:
      changed: ${{ steps.deploy.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: git config --global core.longpaths true

      - run: flutter config --enable-windows-desktop

      - run: flutter create .

      - run: flutter pub get

      - id: deploy
        shell: pwsh
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          $flavor = "${{ inputs.flavor }}"
          $baseVersion = "${{ inputs.base_version }}"
          $usePatch = "${{ inputs.use_patch }}"
          $TARGET_ID = if ($flavor -eq "prod") { "ed427ccb-5edb-4594-a376-2ee9636bef4e" } else { "e962126d-ee7a-48f2-b89d-fb0349f4a05f" }
          (Get-Content shorebird.yaml) -replace '^app_id:.*', "app_id: $TARGET_ID" | Set-Content shorebird.yaml

          $versionChanged = $false
          
          if ($usePatch -eq "true") {
            shorebird patch windows --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | Tee-Object -Variable patchOutput
            $patchExitCode = $LASTEXITCODE

            if ($patchExitCode -ne 0) {
              if ($patchOutput -match "Release not found|No release exists|UnpatchableChangeException|asset changes") {
                shorebird release windows --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | Tee-Object -Variable releaseOutput
                $releaseExitCode = $LASTEXITCODE
                if ($releaseExitCode -ne 0) {
                  if ($releaseOutput -match "existing.*release|already exists") {
                    $versionChanged = $false
                  } else {
                    exit 1
                  }
                } else {
                  $versionChanged = $true
                }
              } else {
                exit 1
              }
            } else {
              $versionChanged = $false
            }
          } else {
            shorebird release windows --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | Tee-Object -Variable releaseOutput
            $releaseExitCode = $LASTEXITCODE
            if ($releaseExitCode -ne 0) {
              if ($releaseOutput -match "existing.*release|already exists") {
                $versionChanged = $false
              } else {
                exit 1
              }
            } else {
              $versionChanged = $true
            }
          }
          echo "changed=$versionChanged" >> $env:GITHUB_OUTPUT
