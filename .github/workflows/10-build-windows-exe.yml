name: Build Windows Executable
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
    outputs:
      exe_path:
        value: ${{ jobs.build.outputs.exe_path }}
      exe_name:
        value: ${{ jobs.build.outputs.exe_name }}
jobs:
  build:
    runs-on: windows-latest
    environment: ${{ inputs.flavor }}
    outputs:
      exe_path: ${{ steps.find_build.outputs.path }}
      exe_name: ${{ steps.rename.outputs.exe_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: git config --global core.longpaths true
      - uses: actions/cache@v4
        with:
          path: build/windows
          key: ${{ runner.os }}-windows-build-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-build-
      - run: |
          # Clean CMake cache to avoid generator mismatch
          if (Test-Path "build\windows\CMakeCache.txt") {
            Remove-Item "build\windows\CMakeCache.txt" -Force
          }
          if (Test-Path "build\windows\CMakeFiles") {
            Remove-Item "build\windows\CMakeFiles" -Recurse -Force
          }
          
          flutter build windows --release --dart-define=ENV=${{ inputs.flavor }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh
      - id: find_build
        run: |
          $outputPath = "build\windows\x64\runner\Release"
          if (Test-Path $outputPath) {
            echo "Found path: $outputPath"
            echo "path=$outputPath" >> $env:GITHUB_OUTPUT
          } else {
            $outputPath = "build\windows\runner\Release"
            echo "Using fallback path: $outputPath"
            echo "path=$outputPath" >> $env:GITHUB_OUTPUT
          }
          Get-ChildItem $outputPath
        shell: pwsh
      - id: rename
        run: |
          $flavor = "${{ inputs.flavor }}"
          $basePath = "${{ steps.find_build.outputs.path }}"
          $files = Get-ChildItem -Path $basePath -Filter "*.exe" -File
          if ($flavor -eq "dev") {
            $newName = "abujena_windows_dev.exe"
          } else {
            $newName = "abujena_windows.exe"
          }
          if ($files.Count -gt 0) {
            Rename-Item -Path $files[0].FullName -NewName $newName
            Write-Host "✅ Renamed executable to $newName"
            echo "exe_name=$newName" >> $env:GITHUB_OUTPUT
          } else {
            echo "exe_name=app.exe" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ inputs.flavor }}
          path: ${{ steps.find_build.outputs.path }}/*.exe
          retention-days: 5
