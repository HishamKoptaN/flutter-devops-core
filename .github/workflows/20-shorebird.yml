name: Deploy Shorebird

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      platforms:
        type: string
        required: false
        default: ""
    outputs:
      full_version:
        value: ${{ jobs.version.outputs.full_version }}
    secrets:
      SHOREBIRD_TOKEN:
        required: false
jobs:
  version:
    uses: ./.github/workflows/00-core-get-version.yml

  android:
    needs: version
    if: contains(inputs.platforms, 'android')
    uses: ./.github/workflows/20-shorebird-android.yml
    with:
      flavor: ${{ inputs.flavor }}
      full_version: ${{ needs.version.outputs.full_version }}
      base_version: ${{ needs.version.outputs.base_version }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

  windows:
    needs: version
    if: contains(inputs.platforms, 'windows')
    uses: ./.github/workflows/20-shorebird-windows.yml
    with:
      flavor: ${{ inputs.flavor }}
      full_version: ${{ needs.version.outputs.full_version }}
    secrets:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  combine:
    needs: [version, android, windows]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ needs.version.outputs.full_version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        run: |
          a="${{ needs.android.outputs.changed }}"
          w="${{ needs.windows.outputs.changed }}"
          if [ "$a" = "true" ] || [ "$w" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
