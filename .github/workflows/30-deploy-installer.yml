name: Deploy Installer

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      full_version:
        type: string
        required: true
      exe_name:
        type: string
        required: false
        default: "app.exe"
      app_name:
        type: string
        required: false
        default: "MyApp"
      app_publisher:
        type: string
        required: false
        default: "MyCompany"
    outputs:
      installer_name:
        value: ${{ jobs.build_installer.outputs.installer_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_windows: ${{ steps.check.outputs.has_windows }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d "windows" ] && [ -f "windows/CMakeLists.txt" ]; then
            echo "has_windows=true" >> $GITHUB_OUTPUT
          else
            echo "has_windows=false" >> $GITHUB_OUTPUT
          fi

  prepare:
    needs: check
    if: needs.check.outputs.has_windows == 'true'
    uses: ./.github/workflows/20-prepare-installer.yml
    with:
      flavor: ${{ inputs.flavor }}
      full_version: ${{ inputs.full_version }}
      exe_name: ${{ inputs.exe_name }}
      app_name: ${{ inputs.app_name }}
      app_publisher: ${{ inputs.app_publisher }}

  build_installer:
    needs: [check, prepare]
    if: needs.check.outputs.has_windows == 'true'
    uses: ./.github/workflows/30-build-installer.yml
    with:
      flavor: ${{ inputs.flavor }}
      app_name: ${{ inputs.app_name }}
