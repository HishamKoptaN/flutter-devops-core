name: "Setup Android Shorebird Action"
description: "Initializes Flutter, Shorebird CLI, Gradle, and dependency caches"
runs:
  using: "composite"
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version-file: pubspec.yaml
        channel: "stable"
        cache: true
    - uses: shorebirdtech/setup-shorebird@v1
      with:
        cache: true
    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - uses: actions/cache@v4
      with:
        path: |
          build/
          .dart_tool/build
        key: patch-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}-${{ runner.os }}
        restore-keys: |
          patch-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}-
          patch-${{ runner.os }}-