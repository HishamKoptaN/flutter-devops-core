name: "Setup Android Shorebird Action"
description: "Initializes Flutter, Shorebird CLI, Gradle, and dependency caches"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: bash ${{ github.action_path }}/../../scripts/get-flutter-version.sh
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true  
    - uses: shorebirdtech/setup-shorebird@v1
      with:
        cache: true    
    - uses: actions/cache@v4
      with:
        path: /opt/hostedtoolcache/flutter
        key: flutter-sdk-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
        restore-keys: flutter-sdk-${{ env.FLUTTER_VERSION }}-
    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          ${{ github.workspace }}/.dart_tool
        key: flutter-deps-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}
        restore-keys: flutter-deps-   
    - uses: actions/cache@v4
      with:
        path: |
          ~/.config/shorebird
          ~/.shorebird
        key: shorebird-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
        restore-keys: shorebird-${{ runner.os }}-

    - uses: actions/cache@v4
      with:
        path: |
          build/
          .dart_tool/build
        key: patch-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}-${{ runner.os }}
        restore-keys: |
          patch-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}-
          patch-${{ runner.os }}-