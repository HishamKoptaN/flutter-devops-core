name: setup-shorebird
description: setup-shorebird
inputs:
  shorebird_token:
    description: "Shorebird Secret Token"
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          .dart_tool
        key: ${{ runner.os }}-${{ hashFiles('**/pubspec.lock')}} 
    - uses: shorebirdtech/setup-shorebird@v1
      with:
        cache: true
      env:
        SHOREBIRD_TOKEN: ${{ inputs.shorebird_token }}  

        