name: setup-ios-shorebird
description: setup-ios-shorebird
inputs:
  p12_password:
    required: true
  shorebird_token:
    required: true 
  build_certificate_base64:
    required: true
  provisioning_profile_base64:
    required: true
runs:
  using: "composite"
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        cache: true  
    - uses: shorebirdtech/setup-shorebird@v1
      with:
        cache: true
      env:
        SHOREBIRD_TOKEN: ${{ inputs.shorebird_token }}    
    - uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          ${{ github.workspace }}/.dart_tool
        key: flutter-deps-ios-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}
        restore-keys: flutter-deps-ios-   
    - uses: actions/cache@v4
      with:
        path: |
          ~/.config/shorebird
          ~/.shorebird
        key: shorebird-ios-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
        restore-keys: shorebird-ios-${{ runner.os }}-
    - shell: bash 
      env:
        P12_PASSWORD: ${{ inputs.p12_password }}
        BUILD_CERTIFICATE_BASE64: ${{ inputs.build_certificate_base64 }}
        PROVISIONING_PROFILE_BASE64: ${{ inputs.provisioning_profile_base64 }}
      run: |
         mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
         cp ios/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
         security create-keychain -p "" build.keychain
         security default-keychain -s build.keychain
         security unlock-keychain -p "" build.keychain
         security import ios/certificate.p12 -k build.keychain -P "$p12_password" -A -t cert -f pkcs12
         security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
         security find-identity -v -p codesigning   
    - run: flutter pub get
      shell: bash
    - run: |
        cd ios
        pod install
      shell: bash