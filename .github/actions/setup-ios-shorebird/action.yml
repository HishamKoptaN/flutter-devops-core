name: setup-ios-shorebird
description: setup-ios-shorebird
inputs:
  p12_password:
    required: true
  shorebird_token:
    required: true 
runs:
  using: "composite"
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        cache: true  
    - uses: shorebirdtech/setup-shorebird@v1
      with:
        cache: true
      env:
        SHOREBIRD_TOKEN: ${{ inputs.shorebird_token }}    
    - uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          ${{ github.workspace }}/.dart_tool
        key: flutter-deps-ios-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}
        restore-keys: flutter-deps-ios-   
    - uses: actions/cache@v4
      with:
        path: |
          ~/.config/shorebird
          ~/.shorebird
        key: shorebird-ios-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
        restore-keys: shorebird-ios-${{ runner.os }}-
    - run: flutter pub get
      shell: bash
    - run: |
        cd ios
        pod install
      shell: bash