name: get-build-version
description: get-build-version

inputs:
  platform:
    type: string
    required: true
  shorebird_app_id:
    required: true
outputs:
  build_name:
    value: ${{ steps.version_calculator.outputs.BUILD_NAME }}
  build_number:
    value: ${{ steps.version_calculator.outputs.BUILD_NUMBER }}
runs:
  using: "composite"
  steps:
    - id: version_calculator
      shell: bash
      run: |

        TARGET_ID="${{ inputs.shorebird_app_id }}"
        PLATFORM="${{ inputs.platform }}"
        if [ "$RUNNER_OS" == "macOS" ]; then
          sed -i '' "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
        else
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
        fi

        # ==========================================
        # 2. جلب بيانات الإصدارات والبيئة الحالية
        # ==========================================

        raw_list=$(shorebird releases list --platform=$PLATFORM 2>/dev/null || true)
        build_numbers=$(echo "$raw_list" | grep -oE '\+[0-9]+' | tr -d '+' || true)
        current_flutter_version=$(flutter --version | head -n 1 | awk '{print $2}')

        # ==========================================
        # 3. تحديد اسم الإصدار الأساسي (Build Name)
        # ==========================================

        if [ -z "$raw_list" ]; then
          BUILD_NAME="1.0.0"
          BUILD_NUMBER="1"
        else
          latest_flutter_version=$(echo "$latest_line" | awk '{print $NF}')
          raw_base=$(echo "$latest_full_version" | cut -d'+' -f1)
          BUILD_NAME=$(echo "$raw_base" | cut -d'-' -f1)
        fi
         [ -z "$BUILD_NAME" ] && BUILD_NAME="1.0.0"

        # ==========================================
        # 4. خوارزمية البحث عن رقم بناء صالح (Smart Loop)
        # ==========================================  

        if [ -z "$build_numbers" ]; then
          BUILD_NUMBER="1"
         else
          max_build=$(echo "$build_numbers" | sort -n | tail -n 1)
          candidate_number=$((max_build + 1))

          while true; do
            existing_release=$(echo "$raw_list" | grep "+$candidate_number" || true)

            if [ -z "$existing_release" ]; then
              BUILD_NUMBER=$candidate_number
              break
            else
              existing_flutter_version=$(echo "$existing_release" | awk '{print $NF}')
              if [ "$current_flutter_version" == "$existing_flutter_version" ]; then
                BUILD_NUMBER=$candidate_number
                break
              else
                candidate_number=$((candidate_number + 1))
              fi  
            fi
          done
        fi
        echo "Calculated Build Name: $BUILD_NAME"
        echo "Calculated Build Number: $BUILD_NUMBER"
        echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_OUTPUT
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT