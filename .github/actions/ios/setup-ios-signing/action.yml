name: setup-ios-signing
description: Automatic iOS Code Signing via App Store Connect API using setup-apple-certificate and apple-provisioning
inputs:
  appstore_issuer_id:
    required: true  
  appstore_api_key_id:
    required: true
runs:
  using: "composite"
  steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      # - shell: bash
      #   run: |
      #     dotnet tool install --global AppleDev.Tools --version 0.5.0
      #     apple ci certificates create \
      #       --api-key-id "${{ inputs.appstore_api_key_id }}" \
      #       --api-issuer-id "${{ inputs.appstore_issuer_id }}" \
      #       --api-private-key "ios/api_private_key.p8" \
      #       --type "Distribution"
      - uses: apple-actions/generate-codesign-cert@v1
        with:
          issuer-id: ${{ inputs.appstore_issuer_id }}
          api-key-id: ${{ inputs.appstore_api_key_id }}
          api-private-key-path: '${{ github.workspace }}/ios/api_private_key.p8'
          cert-password: 163200
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - shell: bash
        run: |
          gem install fastlane
      - shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.appstore_api_key_id }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.appstore_issuer_id }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_PATH: '${{ github.workspace }}/ios/api_private_key.p8'
        run: |
          cd ios
          fastlane generate_profile
      # - shell: bash
      #   env:
      #     APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.appstore_api_key_id }}
      #     APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.appstore_issuer_id }}
      #     APP_STORE_CONNECT_API_PRIVATE_KEY_PATH: '${{ github.workspace }}/ios/api_private_key.p8'
