name: setup-ios-signing
description: Automatic iOS Code Signing via App Store Connect API using setup-apple-certificate and apple-provisioning
inputs:
  appstore_issuer_id:
    required: true  
  appstore_api_key_id:
    required: true
  appstore_api_private_key:
    required: true
  
runs:
  using: "composite"
  steps:
      # - uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '8.x'
      # - shell: bash
      #   run: |
      #     dotnet tool install --global AppleDev.Tools --version 0.5.0
      #     apple ci certificates create \
      #       --api-key-id "${{ inputs.appstore_api_key_id }}" \
      #       --api-issuer-id "${{ inputs.appstore_issuer_id }}" \
      #       --api-private-key "ios/api_private_key.p8" \
      #       --type "Distribution"
      - name: Read Private Key Content
        shell: bash 
        run: |
        id: read_key
          KEY_CONTENT=$(cat ios/api_private_key.p8)
          echo "key_content<<EOF" >> $GITHUB_ENV
          echo "$KEY_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV 
      - id: profiles
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: 'com.muein.orders'
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ inputs.appstore_issuer_id }}
          api-key-id: ${{ inputs.appstore_api_key_id }}
          api-private-key: ${{ inputs.appstore_api_private_key }}
      - shell: bash
        env:
          PROFILES: ${{ steps.profiles.outputs.profiles }}
        run: |
          for name in "AppStore com.muein.orders" "DeveloperID com.muein.orders"; do
            jq -e --arg name "$name" 'any(.[]; .name == $name)' <<<"$PROFILES" >/dev/null \
              || { echo "::error::No ACTIVE provisioning profile \"$name\""; exit 1; }
          done
