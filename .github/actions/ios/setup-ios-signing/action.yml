name: setup-ios-signing
description: Automatic iOS Code Signing via App Store Connect API using setup-apple-certificate and apple-provisioning
inputs:
  appstore_issuer_id:
    required: true  
  appstore_api_key_id:
    required: true
  appstore_api_private_key:
    required: true
  distribution_private_key:
    required: true
  bundle_id:
    required: false
    default: 'com.muein.orders'
  team_id:
    required: false
    default: '5493DS73C7'
  p12-password:
    required: false
outputs:
  p12-password:
    description: "P12 password"
    value: ${{ steps.cert.outputs.p12-password }}
  keychain-password:
    description: "Keychain password"
    value: ${{ steps.cert.outputs.keychain-password }}
  codesign-identity:
    description: "Codesign identity"
    value: ${{ steps.cert.outputs.codesign-identity }}
  provisioning-profile-name:
    description: "Provisioning profile name"
    value: ${{ steps.cert.outputs.provisioning-profile-name }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
    - uses: kebechet/setup-apple-certificate@v1
      id: cert
      with:
        app-store-connect-key-id: ${{ inputs.appstore_api_key_id }}
        app-store-connect-issuer-id: ${{ inputs.appstore_issuer_id }}
        app-store-connect-private-key: ${{ inputs.appstore_api_private_key }}
        distribution-private-key: ${{ inputs.distribution_private_key }}
        bundle-identifier: ${{ inputs.bundle_id }}
    - shell: bash
      env:
        DISTRIBUTION_PRIVATE_KEY: ${{ inputs.distribution_private_key }}
      run: |
        mkdir -p ~/.certs
        echo "$DISTRIBUTION_PRIVATE_KEY" | base64 --decode > ~/.certs/distribution_key.pem
        echo "تم تجهيز المفتاح بنجاح"
    - uses: maui-actions/apple-provisioning@v4
      with:
        certificate: ${{ steps.cert.outputs.p12-certificate-base64 }}
        certificate-passphrase: ${{ steps.cert.outputs.p12-password }}
        bundle-identifiers: ${{ inputs.bundle_id }}
        profile-types: IOS_APP_STORE
        app-store-connect-key-id: ${{ inputs.appstore_api_key_id }}
        app-store-connect-issuer-id: ${{ inputs.appstore_issuer_id }}
        app-store-connect-private-key: ${{ inputs.appstore_api_private_key }}
    - shell: bash
      run: |
        mkdir -p ios
        PROFILE_PATH=$(ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -n 1)
        if [ -n "$PROFILE_PATH" ]; then
          PROFILE_NAME=$(python3 -c "import plistlib; plist = plistlib.loads(open('$PROFILE_PATH', 'rb').read()); print(plist.get('Name', ''))")
          echo "Found provisioning profile: $PROFILE_NAME"
        else
          PROFILE_NAME="match AppStore ${{ inputs.bundle_id }}"
          echo "No provisioning profile found, defaulting to: $PROFILE_NAME"
        fi

        cat << EOF > ios/ExportOptions.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ inputs.team_id }}</string>
            <key>provisioningProfiles</key>
            <dict>
                <key>${{ inputs.bundle_id }}</key>
                <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
        </dict>
        </plist>
        EOF
        echo "Successfully generated ios/ExportOptions.plist with profile: $PROFILE_NAME"
