name: setup-ios-signing
description: Automatic iOS Code Signing via App Store Connect API using setup-apple-certificate and apple-provisioning
inputs:
  appstore_issuer_id:
    required: true  
  appstore_api_key_id:
    required: true
  appstore_api_private_key:
    required: true
  
runs:
  using: "composite"
  steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - shell: bash
        run: |
          gem install fastlane
      - shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.appstore_api_key_id }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.appstore_issuer_id }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_PATH: '${{ github.workspace }}/ios/api_private_key.p8'
          APP_STORE_CONNECT_API_PRIVATE_KEY_CONTENT: ${{ inputs.appstore_api_private_key }}
        run: |
          echo "$APP_STORE_CONNECT_API_PRIVATE_KEY_CONTENT" > ios/api_private_key.p8
          cd ios
          fastlane get_certs
      - id: profiles
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: 'com.muein.orders'
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ inputs.appstore_issuer_id }}
          api-key-id: ${{ inputs.appstore_api_key_id }}
          api-private-key: ${{ inputs.appstore_api_private_key }}
      - shell: bash
        env:
          PROFILES: ${{ steps.profiles.outputs.profiles }}
        run: |
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROFILES" | jq -r '.[] | .fileContent + " " + .uuid' | while read -r content uuid; do
              if [ -n "$content" ] && [ "$content" != "null" ]; then
                echo "$content" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid.mobileprovision"
                echo "Installed provisioning profile: $uuid.mobileprovision"
              fi
            done

            for name in "com.muein.orders AppStore"; do
              jq -e --arg name "$name" 'any(.[]; .name == $name)' <<<"$PROFILES" >/dev/null \
                || { echo "::error::No ACTIVE provisioning profile \"$name\""; exit 1; }
            done
