name: setup-ios-signing
description: Automatic iOS Code Signing via App Store Connect API using setup-apple-certificate and apple-provisioning
inputs:
  appstore_issuer_id:
    required: true  
  appstore_api_key_id:
    required: true
  appstore_api_private_key:
    required: true
  distribution_private_key:
    required: false
    default: ''
  certificate-base64:
    required: false
    default: ''
  bundle_id:
    required: false
    default: 'com.muein.orders'
  team_id:
    required: false
    default: '5493DS73C7'
  p12-password:
    required: false
outputs:
  p12-password:
    description: "P12 password"
    value: ${{ inputs.p12-password }}
  keychain-password:
    description: "Keychain password"
    value: ${{ steps.cert.outputs.keychain-password }}
  codesign-identity:
    description: "Codesign identity"
    value: ${{ steps.cert.outputs.codesign-identity }}
  provisioning-profile-name:
    description: "Provisioning profile name"
    value: ${{ steps.profile.outputs.profile-name }}
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        DISTRIBUTION_PRIVATE_KEY: ${{ inputs.distribution_private_key }}
        APPSTORE_API_PRIVATE_KEY: ${{ inputs.appstore_api_private_key }}
      run: |
        mkdir -p ~/.certs
        echo "$DISTRIBUTION_PRIVATE_KEY" | base64 --decode > ~/.certs/distribution_key.pem
        mkdir -p ios
        printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" | tr -d '\r' > ios/api_private_key.p8
    - id: cert
      uses: apple-actions/import-codesign-certs@v3
      with:
        p12-file-base64: ${{ inputs.certificate-base64 != '' && inputs.certificate-base64 || inputs.distribution_private_key }}
        p12-password: ${{ inputs.p12-password }}
    - uses: apple-actions/download-provisioning-profiles@v3
      with:
        bundle-id: ${{ inputs.bundle_id }}
        issuer-id: ${{ inputs.appstore_issuer_id }}
        api-key-id: ${{ inputs.appstore_api_key_id }}
        api-private-key: ${{ inputs.appstore_api_private_key }}
    - id: profile
      shell: bash
      run: |
        mkdir -p ios
        PROFILE_PATH=$(ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -n 1)
        if [ -n "$PROFILE_PATH" ]; then
          PROFILE_NAME=$(python3 -c "import plistlib; plist = plistlib.loads(open('$PROFILE_PATH', 'rb').read()); print(plist.get('Name', ''))")
          echo "Found provisioning profile: $PROFILE_NAME"
        else
          PROFILE_NAME="match AppStore ${{ inputs.bundle_id }}"
          echo "No provisioning profile found, defaulting to: $PROFILE_NAME"
        fi
        echo "profile-name=$PROFILE_NAME" >> $GITHUB_OUTPUT

        cat << EOF > ios/ExportOptions.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ inputs.team_id }}</string>
            <key>provisioningProfiles</key>
            <dict>
                <key>${{ inputs.bundle_id }}</key>
                <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
        </dict>
        </plist>
        EOF
        echo "Successfully generated ios/ExportOptions.plist with profile: $PROFILE_NAME"
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    - shell: bash
      run: |
        gem install fastlane
    - shell: bash
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.appstore_api_key_id }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.appstore_issuer_id }}
        APP_STORE_CONNECT_API_PRIVATE_KEY_PATH: '${{ github.workspace }}/ios/api_private_key.p8'
      run: |
        cd ios
        fastlane generate_profile
