name: setup-ios-signing
description: Automatically generate and setup iOS signing certificates and provisioning profiles using App Store Connect API
inputs:
  appstore_issuer_id:
    required: true  
  appstore_api_key_id:
    required: true
  appstore_api_private_key:
    required: true
  bundle-id:
    required: false
    default: 'com.muein.orders'
runs:
  using: "composite"
  steps:
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: false

    - name: Install Fastlane
      shell: bash
      run: gem install fastlane

    - name: Generate and Setup iOS Signing & Provisioning Profile
      shell: bash
      env:
        APPSTORE_ISSUER_ID: ${{ inputs.appstore_issuer_id }}
        APPSTORE_API_KEY_ID: ${{ inputs.appstore_api_key_id }}
        APPSTORE_API_PRIVATE_KEY: ${{ inputs.appstore_api_private_key }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
      run: |
        ruby -e '
          require "fastlane"
          api_key = Fastlane::Actions::AppStoreConnectApiKeyAction.run(
            issuer_id: ENV["APPSTORE_ISSUER_ID"],
            key_id: ENV["APPSTORE_API_KEY_ID"],
            key_content: ENV["APPSTORE_API_PRIVATE_KEY"]
          )
          
          Fastlane::Actions::CertAction.run(
            api_key: api_key,
            development: false,
            generate_apple_certs: true
          )
          
          Fastlane::Actions::SighAction.run(
            api_key: api_key,
            app_identifier: ENV["BUNDLE_ID"],
            adhoc: false
          )
        'ء