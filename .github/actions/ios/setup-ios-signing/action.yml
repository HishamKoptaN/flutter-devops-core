name: setup-ios-signing
description: Automatic iOS Code Signing via App Store Connect API using setup-apple-certificate and apple-provisioning
inputs:
  appstore_issuer_id:
    required: true  
  appstore_api_key_id:
    required: true
  appstore_api_private_key:
    required: true
  distribution_private_key:
    required: false
    default: ''
  certificate-base64:
    required: false
    default: ''
  bundle_id:
    required: false
    default: 'com.muein.orders'
  team_id:
    required: false
    default: '5493DS73C7'
  p12-password:
    required: false
outputs:
  p12-password:
    description: "P12 password"
    value: ${{ inputs.p12-password }}
  keychain-password:
    description: "Keychain password"
    value: ${{ steps.cert.outputs.keychain-password }}
  codesign-identity:
    description: "Codesign identity"
    value: ${{ steps.cert.outputs.codesign-identity }}
  provisioning-profile-name:
    description: "Provisioning profile name"
    value: ${{ steps.profile.outputs.profile-name }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    - shell: bash
      run: |
        gem install fastlane
    - shell: bash
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.appstore_api_key_id }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.appstore_issuer_id }}
        APP_STORE_CONNECT_API_PRIVATE_KEY_PATH: '${{ github.workspace }}/ios/api_private_key.p8'
      run: |
        cd ios
        fastlane generate_profile
