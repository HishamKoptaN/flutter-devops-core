name: setup-ios-signing
description: setup-ios-signing
inputs:
  certificate-base64:
    required: false
    default: ""
    description: "Base64 encoded .p12 certificate"
  p12-password:
    required: false
    default: ""
  appstore_issuer_id:
    required: true  
  appstore_api_key_id:
    required: true
  appstore_api_private_key:
    required: true
runs:
  using: "composite"
  steps:
    - id: generate_password
      shell: bash
      run: |
        if [ -z "${{ inputs.p12-password }}" ]; then
          GEN_PASS=$(openssl rand -base64 32)
          echo "p12_pass=$GEN_PASS" >> $GITHUB_OUTPUT
        else
          echo "p12_pass=${{ inputs.p12-password }}" >> $GITHUB_OUTPUT
        fi
    - name: Decode Certificate or Auto-Generate
      shell: bash
      env:
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.appstore_issuer_id }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.appstore_api_key_id }}
        APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ inputs.appstore_api_private_key }}
        P12_PASSWORD: ${{ steps.generate_password.outputs.p12_pass }}
      run: |
        mkdir -p ios
        if [ -n "${{ inputs.certificate-base64 }}" ]; then
          echo "${{ inputs.certificate-base64 }}" | base64 --decode > ios/certificate.p12
          echo "Certificate decoded from base64 input."
        elif [ -f "ios/certificate.p12" ]; then
          echo "Using existing ios/certificate.p12"
        else
          echo "Certificate not provided. Auto-generating certificate and provisioning profile using App Store Connect API..."
          cd ios
          bundle install || gem install fastlane
          bundle exec fastlane generate_signing_certs
          cd ..
        fi
    - uses: apple-actions/import-codesign-certs@v7
      with:
        p12-filepath: ios/certificate.p12
        p12-password: ${{ steps.generate_password.outputs.p12_pass }}
        keychain: signing_temp
        create-keychain: true
    - uses: apple-actions/download-provisioning-profiles@v6
      with:
        bundle-id: 'com.muein.orders'
        profile-type: 'IOS_APP_STORE'
        issuer-id: ${{ inputs.appstore_issuer_id }}
        api-key-id: ${{ inputs.appstore_api_key_id }}
        api-private-key: ${{ inputs.appstore_api_private_key }}