name: iOS Deploy Decision
on:
  workflow_call:
    inputs:
      method:
        description: "طريقة النشر"
        required: true
        default: "fastlane-match"
        type: string
      track:
        description: "App Store track"
        required: true
        default: "testflight"
        type: string
      force_patch:
        description: "فرض استخدام Shorebird Patch"
        required: false
        default: false
        type: boolean
      force_release:
        description: "فرض إنشاء إصدار جديد"
        required: false
        default: false
        type: boolean

    outputs:
      action:
        description: "الإجراء المحدد"
        value: ${{ jobs.decide.outputs.action }}
      method:
        description: "طريقة النشر المحددة"
        value: ${{ jobs.decide.outputs.method }}
      version_code:
        description: "رقم الإصدار"
        value: ${{ jobs.check-version.outputs.version_code }}
      version_name:
        description: "اسم الإصدار"
        value: ${{ jobs.check-version.outputs.version_name }}
      version_exists:
        description: "هل الإصدار موجود"
        value: ${{ jobs.check-version.outputs.version_exists }}

jobs:
  check-version:
    uses: ./.github/workflows/20-version-check-appstore.yml
    secrets: inherit

  check-native:
    uses: ./.github/workflows/10-detect-ios-native-changes.yml

  decide:
    runs-on: ubuntu-latest
    needs: [check-version, check-native]
    outputs:
      action: ${{ steps.decide.outputs.action }}
      method: ${{ steps.decide.outputs.method }}
    steps:
      - id: decide
        run: |
          VERSION_EXISTS="${{ needs.check-version.outputs.version_exists }}"
          HAS_NATIVE="${{ needs.check-native.outputs.has_native_changes }}"
          METHOD="${{ inputs.method || 'fastlane-match' }}"
          echo "   منصة: iOS (App Store)"
          FORCE_PATCH="${{ inputs.force_patch }}"
          FORCE_RELEASE="${{ inputs.force_release }}"
          if [ "$FORCE_PATCH" == "true" ]; then
            echo "action=patch" >> $GITHUB_OUTPUT
          elif [ "$FORCE_RELEASE" == "true" ]; then
            echo "action=release" >> $GITHUB_OUTPUT
          elif [ "$HAS_NATIVE" == "true" ] && [ "$VERSION_EXISTS" == "true" ]; then
            echo "action=bump-and-release" >> $GITHUB_OUTPUT
          elif [ "$HAS_NATIVE" == "true" ]; then
            echo "action=release" >> $GITHUB_OUTPUT
          elif [ "$VERSION_EXISTS" == "true" ]; then
            echo "action=patch" >> $GITHUB_OUTPUT
          else
            echo "action=release" >> $GITHUB_OUTPUT
          fi
          echo "method=$METHOD" >> $GITHUB_OUTPUT
