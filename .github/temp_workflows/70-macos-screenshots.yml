name: macOS Screenshots Only
on:
  push:
    branches:
      - prods
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

jobs:
  setup:
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      device_id: ${{ steps.simulator.outputs.device_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true
      - run: |
          flutter pub get
          cd ios && pod install --repo-update
      - id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 16" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi
          xcrun simctl boot "$DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> $GITHUB_OUTPUT
          sleep 30

  screenshots:
    runs-on: macos-latest
    needs: setup
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - run: |
          flutter pub get
          cd ios && pod install --repo-update
          flutter build ios --${{ env.BUILD_TYPE }} --no-codesign
