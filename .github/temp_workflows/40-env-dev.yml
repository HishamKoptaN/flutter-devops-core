on:
  push:
    branches:
      - devs
name: Deploy
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/core/setup-flutter@prod
      - run: flutter upgrade
      - run: flutter pub get
      - run: flutter build web --dart-define=FLUTTER_ENV=dev
      - run: sed -i 's|<base href="/">|<base href="/m_d/">|' build/web/index.html
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /domains/hotpink-gnu-383634.hostingersite.com/public_html/m_d/
          local-dir: ./build/web/
