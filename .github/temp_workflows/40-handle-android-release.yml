name: Handle Android Release
on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
        description: "Either 'release' or 'bump-and-release'"
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: false
        type: string
        default: "internal"

jobs:
  direct-release:
    if: inputs.action == 'release'
    uses: ./.github/workflows/30-shorebird-android-release.yml
    with:
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}
      track: ${{ inputs.track }}
    secrets: inherit
