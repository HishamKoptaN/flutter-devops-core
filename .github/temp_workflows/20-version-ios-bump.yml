name: Bump iOS Version

on:
  workflow_call:
    inputs:
      current_version_code:
        required: true
        type: string
    outputs:
      new_version_code:
        description: "The new version code after bump"
        value: ${{ jobs.bump.outputs.new_version_code }}
      new_version:
        description: "The new full version string"
        value: ${{ jobs.bump.outputs.new_version }}

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      new_version_code: ${{ steps.bump.outputs.new_version_code }}
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - id: bump
        run: |
          CURRENT_CODE="${{ inputs.current_version_code }}"
          NEW_CODE=$((CURRENT_CODE + 1))
          VERSION_NAME=$(grep -oP '^version:\s*\K[0-9.]+' pubspec.yaml)
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${NEW_CODE}/" pubspec.yaml
          echo "new_version_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "new_version=${VERSION_NAME}+${NEW_CODE}" >> $GITHUB_OUTPUT

      - name: Commit Version Bump
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pubspec.yaml
          git commit -m "🔢 Bump iOS versionCode: ${{ inputs.current_version_code }} → ${{ steps.bump.outputs.new_version_code }}"
          git push
