name: Shorebird macOS Deploy

on:
  workflow_call:
    outputs:
      release_completed:
        value: ${{ jobs.shorebird.outputs.release_completed }}
      patch_completed:
        value: ${{ jobs.shorebird.outputs.patch_completed }}
    secrets: inherit

jobs:
  shorebird:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    outputs:
      release_completed: ${{ steps.deploy.outputs.release_completed }}
      patch_completed: ${{ steps.deploy.outputs.patch_completed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/core/setup-flutter@prod
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - id: deploy
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "🚀 Starting Shorebird macOS deployment for flavor: ${{ inputs.flavor }}"
          TARGET_ID=$(if [ "${{ inputs.flavor }}" = "prod" ]; then echo "macos-prod-id"; else echo "macos-dev-id"; fi)
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          release_completed="false"
          patch_completed="false"
          
          if [ "${{ inputs.use_patch }}" = "true" ]; then
            if shorebird patch macos --dart-define=ENV=${{ inputs.flavor }} --no-tree-shake-icons 2>&1 | tee patch.log; then
              patch_completed="true"
            else
              if shorebird release macos --dart-define=ENV=${{ inputs.flavor }} --no-tree-shake-icons 2>&1 | tee release.log; then
                release_completed="true"
              else
                exit 1
              fi
            fi
          else
            if shorebird release macos --dart-define=ENV=${{ inputs.flavor }} --no-tree-shake-icons 2>&1 | tee release.log; then
              release_completed="true"
            else
              exit 1
            fi
          fi
          
          echo "release_completed=$release_completed" >> $GITHUB_OUTPUT
          echo "patch_completed=$patch_completed" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ inputs.flavor }}
          path: build/macos/**/*.app
          retention-days: 1
