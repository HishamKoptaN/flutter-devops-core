name: Distribute APK to Firebase

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: false
        default: "dev"
    secrets:
      FIREBASE_ADMIN_SDK:
        required: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ inputs.flavor }}
          path: build/app/outputs/flutter-apk/
        continue-on-error: true

      - id: find_apk
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            ls -la build/app/outputs/ 2>/dev/null"
            APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_PATH" ]; then
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
      - id: get_app_id
        run: |
          DART_FILE="lib/config/firebase/${{ inputs.flavor }}/firebase_options.dart"
          if [ -f "$DART_FILE" ]; then
            APP_ID=$(sed -n '/static const FirebaseOptions android/,/);/p' "$DART_FILE" | grep "appId:" | sed "s/.*'\([^']*\)'.*/\1/")
            if [ -n "$APP_ID" ]; then
              echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "app_id=" >> $GITHUB_OUTPUT
      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        if: steps.get_app_id.outputs.app_id != ''
        with:
          appId: ${{ steps.get_app_id.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_ADMIN_SDK }}
          groups: "apk"
          file: ${{ steps.find_apk.outputs.apk_path }}
        continue-on-error: true
      - run: |
          if [ -z "${{ secrets.FIREBASE_ADMIN_SDK }}" ]; then
          else
          fi
