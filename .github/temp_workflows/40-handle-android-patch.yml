name: Handle Android Patch
on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
      version_name:
        required: true
        type: string
      track:
        required: false
        type: string
        default: "internal"
    outputs:
      requires_new_release:
        description: "Whether a new release is needed"
        value: ${{ jobs.patch.outputs.requires_new_release }}
      new_version_code:
        description: "New version code if bumped"
        value: ${{ jobs.handle-failure.outputs.new_version_code }}

jobs:
  patch:
    runs-on: ubuntu-latest
    outputs:
      requires_new_release: ${{ steps.verify.outputs.requires_new_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-sdk-3.41.2-${{ runner.os }}
          restore-keys: flutter-sdk-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: Cache Dart/Flutter Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/.dart_tool
          key: flutter-deps-${{ hashFiles('pubspec.lock') }}-${{ runner.os }}
          restore-keys: flutter-deps-

      - name: Cache Shorebird
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/shorebird
            ~/.shorebird
          key: shorebird-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'shorebird.yaml') }}
          restore-keys: shorebird-${{ runner.os }}-

      - uses: shorebirdtech/setup-shorebird@v1

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/muein_orders.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=muein_orders.jks
          EOF

      - name: Verify Patch (Dry Run)
        id: verify
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if ! shorebird patch android \
            --dart-define=ENV=prod \
            --flavor=prod \
            --release-version=${{ inputs.version_name }}+${{ inputs.version_code }} \
            --dry-run 2>&1 | tee patch_output.log; then

            if grep -q "Your app contains native changes, which cannot be applied with a patch" patch_output.log; then
              grep -A 20 "Changed files:" patch_output.log | head -25 || echo "   (لم يتم العثور على قائمة الملفات)"
              grep -A 50 "Breaking differences" patch_output.log | head -55 || echo "   (لم يتم العثور على فروقات حرجة)"

              echo "📊 ملخص التغييرات Native:"
              echo "   • التغييرات في DEX files = تغييرات في Dependencies أو Native code"
              echo "   • Class removed = حذف classes أو libraries"
              echo "   • Class signature changed = تغيير في واجهة الـ class"
              echo ""
              echo "💡 الحل: سيتم إنشاء إصدار جديد مع رقم بناء أعلى"
              echo "═══════════════════════════════════════════════════"

              echo "requires_new_release=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "❌ فشل الباتش لسبب آخر"
              cat patch_output.log
              exit 1
            fi
          fi

          echo "✅ يمكن تطبيق الباتش"
          echo "requires_new_release=false" >> $GITHUB_OUTPUT

      - name: Execute Shorebird Patch
        if: steps.verify.outputs.requires_new_release != 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          echo "🚀 تنفيذ Shorebird Patch..."
          shorebird patch android \
            --dart-define=ENV=prod \
            --flavor=prod \
            --release-version=${{ inputs.version_name }}+${{ inputs.version_code }} \
            --confirm

      - name: Cleanup
        if: always()
        run: rm -f android/app/muein_orders.jks android/key.properties

  handle-failure:
    needs: patch
    if: failure() && needs.patch.outputs.requires_new_release != 'true'
    runs-on: ubuntu-latest
    outputs:
      new_version_code: ${{ steps.bump.outputs.new_version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - id: bump
        run: |
          CURRENT="${{ inputs.version_code }}"
          NEW=$((CURRENT + 1))
          echo "new_version_code=$NEW" >> $GITHUB_OUTPUT
          echo "📈 زيادة versionCode: $CURRENT → $NEW"

      - name: Update build.gradle.kts
        run: |
          NEW="${{ steps.bump.outputs.new_version_code }}"
          sed -i "s/versionCode = [0-9]*/versionCode = $NEW/g" android/app/build.gradle.kts
          grep "versionCode" android/app/build.gradle.kts

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle.kts
          git commit -m "bump: versionCode (patch failure) → ${{ steps.bump.outputs.new_version_code }} [skip ci]"
          git push

  release-after-failure:
    needs: [patch, handle-failure]
    if: needs.handle-failure.outputs.new_version_code != ''
    uses: ./.github/workflows/30-shorebird-android-release.yml
    with:
      version_code: ${{ needs.handle-failure.outputs.new_version_code }}
      version_name: ${{ inputs.version_name }}
      track: ${{ inputs.track }}
    secrets: inherit

  handle-native-detected:
    needs: patch
    if: success() && needs.patch.outputs.requires_new_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      new_version_code: ${{ steps.bump.outputs.new_version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - id: bump
        run: |
          CURRENT="${{ inputs.version_code }}"
          NEW=$((CURRENT + 1))
          echo "new_version_code=$NEW" >> $GITHUB_OUTPUT
          echo "📈 زيادة versionCode: $CURRENT → $NEW (Native detected)"

      - name: Update build.gradle.kts
        run: |
          NEW="${{ steps.bump.outputs.new_version_code }}"
          sed -i "s/versionCode = [0-9]*/versionCode = $NEW/g" android/app/build.gradle.kts
          grep "versionCode" android/app/build.gradle.kts

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle.kts
          git commit -m "bump: versionCode (native detected) → ${{ steps.bump.outputs.new_version_code }} [skip ci]"
          git push

  release-after-native:
    needs: [patch, handle-native-detected]
    if: needs.handle-native-detected.outputs.new_version_code != ''
    uses: ./.github/workflows/30-shorebird-android-release.yml
    with:
      version_code: ${{ needs.handle-native-detected.outputs.new_version_code }}
      version_name: ${{ inputs.version_name }}
      track: ${{ inputs.track }}
    secrets: inherit
