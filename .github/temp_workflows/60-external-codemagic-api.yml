name: Trigger Codemagic via API
on:
  push:
    branches: [prod]

jobs:
  trigger:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -X POST "https://api.codemagic.io/builds" \
            -H "Content-Type: application/json" \
            -H "x-auth-token: ${{ secrets.CODEMAGIC_API_TOKEN }}" \
            -d '{
              "appId": "6bb908ca-da56-44da-ac93-6232282ada05",
              "branch": "prod",
              "workflowId": "ios-release"
            }'
          echo "✅ Codemagic build triggered"
