on:
  push:
    branches:
      - prods
name: Deploy
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: HishamKoptaN/flutter-devops-core/.github/actions/core/setup-flutter@prod
      - run: flutter upgrade
      - run: flutter pub get
      - run: flutter build web --dart-define=ENV=prod
      - run: sed -i 's|<base href="/">|<base href="/dashboard/">|' build/web/index.html
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: "ftp"
          port: 21
          server-dir: /public_html/dashboard/
          local-dir: ./build/web/
          dangerous-clean-slate: false
