name: "Flutter DevOps Core Release"
description: "A complete CI/CD pipeline action for Flutter & Shorebird Android release"

inputs:
  shorebird-token:
    description: "Shorebird API Token"
    required: true
  google-play-json:
    description: "Google Play Service Account JSON content"
    required: true
  track:
    description: "Google Play release track"
    required: false
    default: "internal"

runs:
  using: "composite"
  steps:
    - name: Setup Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.pub-cache
          android/.gradle
          .dart_tool
        key: ${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock') }}
    - uses: subosito/flutter-action@v2
      with:
        channel: "stable"
        cache: true
    