name: CI/CD Pipeline

on:
    push:
        branches: [ dev, prod ]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    workflows:
        uses: HishamKoptaN/flutter-devops-core/.github/workflows/00-core-main.yml@prod
        with:
            flavor: ${{ github.ref_name }}
            platforms: "android"
            environment: ${{ github.ref_name }}
        environment: ${{ github.ref_name }}
        secrets:
            FIREBASE_ADMIN_SDK: ${{ secrets.FIREBASE_ADMIN_SDK }}
            SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
            FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
